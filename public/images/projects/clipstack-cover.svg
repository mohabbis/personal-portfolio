<svg width="1600" height="1000" viewBox="0 0 1600 1000" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="clipstack-title">
  <title id="clipstack-title">Clipstack - clipboard history that stays on your Mac</title>
  <defs>
    <linearGradient id="cs-base" x1="0" y1="0" x2="0" y2="1000" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#161210"/>
      <stop offset="1" stop-color="#0c0a08"/>
    </linearGradient>
    <radialGradient id="cs-glow" cx="0.72" cy="0.3" r="0.6">
      <stop offset="0" stop-color="#d8994e" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#d8994e" stop-opacity="0"/>
    </radialGradient>
    <pattern id="cs-dots" width="34" height="34" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.5" fill="#f5efe4" fill-opacity="0.05"/>
    </pattern>
  </defs>

  <rect width="1600" height="1000" fill="url(#cs-base)"/>
  <rect width="1600" height="1000" fill="url(#cs-glow)"/>
  <rect width="1600" height="1000" fill="url(#cs-dots)" opacity="0.5"/>

  <text x="120" y="150" font-family="'SF Pro Display','Helvetica Neue',Arial,sans-serif" font-size="30" font-weight="500" letter-spacing="0.42em" fill="#f5efe4" fill-opacity="0.9">CLIPSTACK</text>
  <text x="120" y="206" font-family="'SF Pro Display','Helvetica Neue',Arial,sans-serif" font-size="24" fill="#f5efe4" fill-opacity="0.45">Local-first clipboard history for macOS</text>

  <g>
    <rect x="700" y="120" width="780" height="760" rx="34" fill="#f5efe4" fill-opacity="0.045" stroke="#f5efe4" stroke-opacity="0.09"/>
    <rect x="740" y="160" width="700" height="64" rx="18" fill="#f5efe4" fill-opacity="0.06"/>
    <circle cx="778" cy="192" r="11" stroke="#f5efe4" stroke-opacity="0.45" stroke-width="3"/>
    <path d="M786 200L796 210" stroke="#f5efe4" stroke-opacity="0.45" stroke-width="3" stroke-linecap="round"/>
    <text x="812" y="201" font-family="'SF Pro Display','Helvetica Neue',Arial,sans-serif" font-size="24" fill="#f5efe4" fill-opacity="0.8">invoice</text>

    <rect x="740" y="252" width="700" height="112" rx="20" fill="#d8994e" fill-opacity="0.14" stroke="#d8994e" stroke-opacity="0.5"/>
    <text x="772" y="298" font-family="'SF Pro Display','Helvetica Neue',Arial,sans-serif" font-size="26" fill="#f5efe4" fill-opacity="0.92">billing.example.com/invoices/2041</text>
    <text x="772" y="338" font-family="'SF Pro Display','Helvetica Neue',Arial,sans-serif" font-size="20" fill="#f0c286" fill-opacity="0.75">TEXT  -  Safari  -  just now</text>
    <text x="1392" y="318" font-family="'SF Pro Display','Helvetica Neue',Arial,sans-serif" font-size="22" fill="#f5efe4" fill-opacity="0.45">1</text>

    <rect x="740" y="384" width="700" height="112" rx="20" fill="#f5efe4" fill-opacity="0.035"/>
    <rect x="772" y="408" width="84" height="64" rx="10" fill="#34c8a6" fill-opacity="0.22" stroke="#34c8a6" stroke-opacity="0.45"/>
    <text x="880" y="432" font-family="'SF Pro Display','Helvetica Neue',Arial,sans-serif" font-size="26" fill="#f5efe4" fill-opacity="0.82">Screenshot 1440 x 900</text>
    <text x="880" y="470" font-family="'SF Pro Display','Helvetica Neue',Arial,sans-serif" font-size="20" fill="#f5efe4" fill-opacity="0.42">IMAGE  -  Preview  -  2 min</text>
    <text x="1392" y="450" font-family="'SF Pro Display','Helvetica Neue',Arial,sans-serif" font-size="22" fill="#f5efe4" fill-opacity="0.35">2</text>

    <rect x="740" y="516" width="700" height="112" rx="20" fill="#f5efe4" fill-opacity="0.035"/>
    <text x="772" y="562" font-family="'SF Pro Display','Helvetica Neue',Arial,sans-serif" font-size="26" fill="#f5efe4" fill-opacity="0.78">Meeting moved to Thursday, 3pm</text>
    <text x="772" y="602" font-family="'SF Pro Display','Helvetica Neue',Arial,sans-serif" font-size="20" fill="#f5efe4" fill-opacity="0.42">TEXT  -  Messages  -  9 min</text>
    <text x="1392" y="582" font-family="'SF Pro Display','Helvetica Neue',Arial,sans-serif" font-size="22" fill="#f5efe4" fill-opacity="0.35">3</text>

    <rect x="740" y="648" width="700" height="112" rx="20" fill="#f5efe4" fill-opacity="0.035"/>
    <text x="772" y="694" font-family="'SF Pro Display','Helvetica Neue',Arial,sans-serif" font-size="26" fill="#f5efe4" fill-opacity="0.7">swift test --parallel</text>
    <text x="772" y="734" font-family="'SF Pro Display','Helvetica Neue',Arial,sans-serif" font-size="20" fill="#f5efe4" fill-opacity="0.42">TEXT  -  Terminal  -  14 min</text>
    <text x="1392" y="714" font-family="'SF Pro Display','Helvetica Neue',Arial,sans-serif" font-size="22" fill="#f5efe4" fill-opacity="0.35">4</text>

    <circle cx="768" cy="822" r="7" fill="#34c8a6"/>
    <text x="788" y="830" font-family="'SF Pro Display','Helvetica Neue',Arial,sans-serif" font-size="22" fill="#f5efe4" fill-opacity="0.5">Capturing - stays on this Mac</text>
  </g>

  <g>
    <rect x="120" y="520" width="480" height="330" rx="30" fill="#f5efe4" fill-opacity="0.05" stroke="#f5efe4" stroke-opacity="0.08"/>
    <text x="160" y="596" font-family="'SF Pro Display','Helvetica Neue',Arial,sans-serif" font-size="24" fill="#f5efe4" fill-opacity="0.55">Keyboard first</text>
    <g font-family="'SF Pro Display','Helvetica Neue',Arial,sans-serif" font-size="26" fill="#f5efe4" fill-opacity="0.85">
      <rect x="160" y="636" width="96" height="64" rx="14" fill="#f5efe4" fill-opacity="0.06" stroke="#f5efe4" stroke-opacity="0.14"/>
      <text x="186" y="678">Up</text>
      <rect x="272" y="636" width="120" height="64" rx="14" fill="#f5efe4" fill-opacity="0.06" stroke="#f5efe4" stroke-opacity="0.14"/>
      <text x="292" y="678">Down</text>
      <rect x="408" y="636" width="152" height="64" rx="14" fill="#d8994e" fill-opacity="0.2" stroke="#d8994e" stroke-opacity="0.55"/>
      <text x="428" y="678">Return</text>
    </g>
    <text x="160" y="786" font-family="'SF Pro Display','Helvetica Neue',Arial,sans-serif" font-size="22" fill="#f5efe4" fill-opacity="0.42">Cmd 1-9 copies directly</text>
  </g>

  <rect x="0.75" y="0.75" width="1598.5" height="998.5" fill="none" stroke="#f5efe4" stroke-opacity="0.06" stroke-width="1.5"/>
</svg>
