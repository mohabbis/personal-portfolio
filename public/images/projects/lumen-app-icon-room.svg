<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 512 512"
  role="img"
  aria-labelledby="title desc"
>
  <title id="title">Lumen room glow app icon</title>
  <desc id="desc">
    A warm gray Lumen icon with a circular room glow and centered light mark.
  </desc>
  <defs>
    <linearGradient
      id="bg"
      x1="64"
      y1="40"
      x2="448"
      y2="512"
      gradientUnits="userSpaceOnUse"
    >
      <stop offset="0" stop-color="#f2f0ed" />
      <stop offset="0.42" stop-color="#bdb8af" />
      <stop offset="1" stop-color="#56554f" />
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="38%" r="58%">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.42" />
      <stop offset="0.62" stop-color="#ffffff" stop-opacity="0.11" />
      <stop offset="1" stop-color="#ffffff" stop-opacity="0" />
    </radialGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="7" />
    </filter>
  </defs>
  <rect width="512" height="512" rx="0" fill="url(#bg)" />
  <circle
    cx="256"
    cy="245"
    r="206"
    fill="none"
    stroke="#ffffff"
    stroke-opacity="0.14"
    stroke-width="8"
  />
  <circle cx="256" cy="245" r="146" fill="url(#halo)" filter="url(#soft)" />
  <path
    d="M256 112c72 0 118 44 118 105 0 82-99 131-118 171-19-40-118-89-118-171 0-61 46-105 118-105Z"
    fill="none"
    stroke="#202020"
    stroke-width="24"
    stroke-linejoin="round"
  />
  <path
    d="M256 148v190"
    stroke="#ffffff"
    stroke-width="35"
    stroke-linecap="round"
  />
  <circle cx="256" cy="256" r="34" fill="#ffffff" />
  <circle cx="256" cy="256" r="17" fill="#e5e1dc" />
</svg>
