<svg width="1600" height="1000" viewBox="0 0 1600 1000" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="wo-cover-title">
  <title id="wo-cover-title">WashOrbit operational CRM</title>
  <defs>
    <linearGradient id="wc-base" x1="0" y1="0" x2="0" y2="1000" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#111a2e"/>
      <stop offset="1" stop-color="#0b1220"/>
    </linearGradient>
    <radialGradient id="wc-glow" cx="0.72" cy="0.24" r="0.62">
      <stop offset="0" stop-color="#3b82f6" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#3b82f6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="wc-ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#60a5fa"/>
      <stop offset="1" stop-color="#2563eb"/>
    </linearGradient>
    <radialGradient id="wc-core" cx="0.5" cy="0.4" r="0.7">
      <stop offset="0" stop-color="#93c5fd"/>
      <stop offset="1" stop-color="#2563eb"/>
    </radialGradient>
    <pattern id="wc-dots" width="34" height="34" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.5" fill="#f5f7fb" fill-opacity="0.05"/>
    </pattern>
  </defs>

  <rect width="1600" height="1000" fill="url(#wc-base)"/>
  <rect width="1600" height="1000" fill="url(#wc-glow)"/>
  <rect width="1600" height="1000" fill="url(#wc-dots)" opacity="0.5"/>

  <text x="120" y="150" font-family="'SF Pro Display',Arial,sans-serif" font-size="24" font-weight="500" letter-spacing="0.24em" fill="#60a5fa" fill-opacity="0.9">OPERATIONAL CRM</text>

  <!-- Orbital mark -->
  <g transform="translate(300 400)">
    <ellipse cx="0" cy="0" rx="168" ry="76" fill="none" stroke="url(#wc-ring)" stroke-width="14" transform="rotate(-28)"/>
    <ellipse cx="0" cy="0" rx="168" ry="76" fill="none" stroke="#60a5fa" stroke-opacity="0.18" stroke-width="30" transform="rotate(-28)"/>
    <circle cx="0" cy="0" r="60" fill="url(#wc-core)"/>
    <circle cx="141" cy="-72" r="22" fill="#0b1220"/>
    <circle cx="141" cy="-72" r="22" fill="none" stroke="#60a5fa" stroke-width="6"/>
  </g>

  <g>
    <text x="560" y="308" font-family="'SF Pro Display',Arial,sans-serif" font-size="76" font-weight="600" fill="#f5f7fb" letter-spacing="-0.03em">Every issue owned</text>
    <text x="560" y="400" font-family="'SF Pro Display',Arial,sans-serif" font-size="76" font-weight="300" fill="#f5f7fb" fill-opacity="0.6" letter-spacing="-0.03em">to verified resolution.</text>
    <line x1="560" y1="460" x2="1380" y2="460" stroke="#f5f7fb" stroke-opacity="0.1"/>
    <text x="560" y="532" font-family="'SF Pro Display',Arial,sans-serif" font-size="26" fill="#f5f7fb" fill-opacity="0.5">Complaints, incidents, claims, approvals</text>
  </g>

  <!-- Pipeline chips: Incident to Case to Resolution -->
  <g font-family="'SF Pro Display',Arial,sans-serif" font-size="26" font-weight="500">
    <rect x="120" y="700" width="300" height="120" rx="24" fill="#f5f7fb" fill-opacity="0.05" stroke="#f5f7fb" stroke-opacity="0.12"/>
    <text x="270" y="752" text-anchor="middle" fill="#60a5fa" font-size="18" letter-spacing="0.16em">INCIDENT</text>
    <text x="270" y="792" text-anchor="middle" fill="#f5f7fb" fill-opacity="0.85">Root cause</text>

    <rect x="460" y="700" width="300" height="120" rx="24" fill="#2563eb" fill-opacity="0.16" stroke="#3b82f6" stroke-opacity="0.5"/>
    <text x="610" y="752" text-anchor="middle" fill="#93c5fd" font-size="18" letter-spacing="0.16em">CASE</text>
    <text x="610" y="792" text-anchor="middle" fill="#f5f7fb" fill-opacity="0.9">Customer + owner</text>

    <rect x="800" y="700" width="300" height="120" rx="24" fill="#f5f7fb" fill-opacity="0.05" stroke="#f5f7fb" stroke-opacity="0.12"/>
    <text x="950" y="752" text-anchor="middle" fill="#34d399" font-size="18" letter-spacing="0.16em">RESOLUTION</text>
    <text x="950" y="792" text-anchor="middle" fill="#f5f7fb" fill-opacity="0.85">Verified + costed</text>

    <g stroke="#f5f7fb" stroke-opacity="0.35" stroke-width="4" fill="none" stroke-linecap="round">
      <path d="M430 760 L455 760"/>
      <path d="M770 760 L795 760"/>
    </g>
  </g>

  <rect x="0.75" y="0.75" width="1598.5" height="998.5" fill="none" stroke="#f5f7fb" stroke-opacity="0.06" stroke-width="1.5"/>
</svg>
