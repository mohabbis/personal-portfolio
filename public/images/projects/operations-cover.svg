<svg width="1600" height="1000" viewBox="0 0 1600 1000" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ops-title">
  <title id="ops-title">Fraternal operations - the systems an organization runs on</title>
  <defs>
    <linearGradient id="op-base" x1="0" y1="0" x2="0" y2="1000" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#161210"/>
      <stop offset="1" stop-color="#0c0a08"/>
    </linearGradient>
    <radialGradient id="op-glow" cx="0.2" cy="0.15" r="0.6">
      <stop offset="0" stop-color="#d8994e" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#d8994e" stop-opacity="0"/>
    </radialGradient>
    <pattern id="op-dots" width="34" height="34" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.5" fill="#f5efe4" fill-opacity="0.05"/>
    </pattern>
  </defs>

  <rect width="1600" height="1000" fill="url(#op-base)"/>
  <rect width="1600" height="1000" fill="url(#op-glow)"/>
  <rect width="1600" height="1000" fill="url(#op-dots)" opacity="0.5"/>

  <text x="120" y="140" font-family="'SF Pro Display',Arial,sans-serif" font-size="24" font-weight="500" letter-spacing="0.24em" fill="#d8994e" fill-opacity="0.85">OPERATIONS</text>
  <text x="118" y="260" font-family="'SF Pro Display',Arial,sans-serif" font-size="128" font-weight="600" fill="#f5efe4" letter-spacing="-0.04em">Systems</text>

  <g font-family="'SF Pro Display',Arial,sans-serif">
    <g>
      <text x="120" y="404" font-size="30" fill="#f5efe4" fill-opacity="0.85">Alumni engagement</text>
      <rect x="900" y="378" width="580" height="14" rx="7" fill="#f5efe4" fill-opacity="0.09"/>
      <rect x="900" y="378" width="470" height="14" rx="7" fill="#d8994e"/>
    </g>
    <line x1="120" y1="452" x2="1480" y2="452" stroke="#f5efe4" stroke-opacity="0.07"/>
    <g>
      <text x="120" y="524" font-size="30" fill="#f5efe4" fill-opacity="0.85">Records and continuity</text>
      <rect x="900" y="498" width="580" height="14" rx="7" fill="#f5efe4" fill-opacity="0.09"/>
      <rect x="900" y="498" width="360" height="14" rx="7" fill="#34c8a6" fill-opacity="0.85"/>
    </g>
    <line x1="120" y1="572" x2="1480" y2="572" stroke="#f5efe4" stroke-opacity="0.07"/>
    <g>
      <text x="120" y="644" font-size="30" fill="#f5efe4" fill-opacity="0.85">Communication</text>
      <rect x="900" y="618" width="580" height="14" rx="7" fill="#f5efe4" fill-opacity="0.09"/>
      <rect x="900" y="618" width="520" height="14" rx="7" fill="#d8994e"/>
    </g>
    <line x1="120" y1="692" x2="1480" y2="692" stroke="#f5efe4" stroke-opacity="0.07"/>
  </g>

  <g transform="translate(120 740)">
    <g stroke="#f5efe4" stroke-opacity="0.16" stroke-width="2">
      <path d="M60 90L260 40"/>
      <path d="M60 90L260 150"/>
      <path d="M260 40L480 90"/>
      <path d="M260 150L480 90"/>
      <path d="M480 90L700 50"/>
      <path d="M480 90L700 140"/>
    </g>
    <circle cx="60" cy="90" r="18" fill="#d8994e"/>
    <circle cx="260" cy="40" r="14" fill="#f5efe4" fill-opacity="0.85"/>
    <circle cx="260" cy="150" r="14" fill="#f5efe4" fill-opacity="0.5"/>
    <circle cx="480" cy="90" r="18" fill="#34c8a6" fill-opacity="0.85"/>
    <circle cx="700" cy="50" r="14" fill="#f5efe4" fill-opacity="0.6"/>
    <circle cx="700" cy="140" r="14" fill="#d8994e" fill-opacity="0.7"/>
  </g>

  <text x="1480" y="900" text-anchor="end" font-family="'SF Pro Display',Arial,sans-serif" font-size="24" fill="#f5efe4" fill-opacity="0.4" letter-spacing="0.08em">Built to survive turnover</text>

  <rect x="0.75" y="0.75" width="1598.5" height="998.5" fill="none" stroke="#f5efe4" stroke-opacity="0.06" stroke-width="1.5"/>
</svg>
