<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 880" role="img" aria-labelledby="ct cd">
  <title id="ct">Car Wash Marketing</title>
  <desc id="cd">Brand strategy for Fancy Car Wash and Car Wash Guys — editorial diptych thumbnail</desc>
  <defs>
    <clipPath id="leftClip">
      <polygon points="0,0 730,0 550,880 0,880"/>
    </clipPath>
    <clipPath id="rightClip">
      <polygon points="730,0 1280,0 1280,880 550,880"/>
    </clipPath>
  </defs>

  <!-- Left panel — premium / FANCY -->
  <rect width="1280" height="880" fill="#fdf6ec"/>
  <g clip-path="url(#leftClip)">
    <rect width="1280" height="880" fill="#fdf6ec"/>
    <!-- Very subtle dot grid -->
    <g fill="#1e1208" fill-opacity="0.04">
      <circle cx="80"  cy="80"  r="1.5"/><circle cx="160" cy="80"  r="1.5"/><circle cx="240" cy="80"  r="1.5"/><circle cx="320" cy="80"  r="1.5"/><circle cx="400" cy="80"  r="1.5"/><circle cx="480" cy="80"  r="1.5"/><circle cx="560" cy="80"  r="1.5"/><circle cx="640" cy="80"  r="1.5"/>
      <circle cx="80"  cy="160" r="1.5"/><circle cx="160" cy="160" r="1.5"/><circle cx="240" cy="160" r="1.5"/><circle cx="320" cy="160" r="1.5"/><circle cx="400" cy="160" r="1.5"/><circle cx="480" cy="160" r="1.5"/><circle cx="560" cy="160" r="1.5"/><circle cx="640" cy="160" r="1.5"/>
      <circle cx="80"  cy="240" r="1.5"/><circle cx="160" cy="240" r="1.5"/><circle cx="240" cy="240" r="1.5"/><circle cx="320" cy="240" r="1.5"/><circle cx="400" cy="240" r="1.5"/><circle cx="480" cy="240" r="1.5"/><circle cx="560" cy="240" r="1.5"/>
      <circle cx="80"  cy="320" r="1.5"/><circle cx="160" cy="320" r="1.5"/><circle cx="240" cy="320" r="1.5"/><circle cx="320" cy="320" r="1.5"/><circle cx="400" cy="320" r="1.5"/><circle cx="480" cy="320" r="1.5"/>
      <circle cx="80"  cy="400" r="1.5"/><circle cx="160" cy="400" r="1.5"/><circle cx="240" cy="400" r="1.5"/><circle cx="320" cy="400" r="1.5"/><circle cx="400" cy="400" r="1.5"/>
      <circle cx="80"  cy="480" r="1.5"/><circle cx="160" cy="480" r="1.5"/><circle cx="240" cy="480" r="1.5"/><circle cx="320" cy="480" r="1.5"/>
      <circle cx="80"  cy="560" r="1.5"/><circle cx="160" cy="560" r="1.5"/><circle cx="240" cy="560" r="1.5"/>
      <circle cx="80"  cy="640" r="1.5"/><circle cx="160" cy="640" r="1.5"/>
      <circle cx="80"  cy="720" r="1.5"/>
      <circle cx="80"  cy="800" r="1.5"/>
    </g>
    <!-- FANCY large -->
    <text x="90" y="380" font-family="Georgia,'Times New Roman',serif" font-size="208" font-weight="400" fill="#1e1208" letter-spacing="-0.04em">Fancy</text>
    <!-- Car Wash below -->
    <text x="93" y="460" font-family="'SF Pro Display','Helvetica Neue',Arial,sans-serif" font-size="40" font-weight="300" fill="#6a4828" letter-spacing="0.12em">CAR WASH</text>
    <!-- Horizontal rule -->
    <line x1="90" y1="496" x2="500" y2="496" stroke="#1e1208" stroke-opacity="0.15" stroke-width="1"/>
    <!-- Descriptor -->
    <text x="90" y="540" font-family="'SF Pro Display','Helvetica Neue',Arial,sans-serif" font-size="15" font-weight="400" fill="#8a6040" letter-spacing="0.06em">Premium positioning · Brand &amp; web</text>
  </g>

  <!-- Diagonal divider -->
  <line x1="730" y1="0" x2="550" y2="880" stroke="#c09060" stroke-opacity="0.35" stroke-width="2"/>
  <!-- Thin shadow line for depth -->
  <line x1="732" y1="0" x2="552" y2="880" stroke="#c09060" stroke-opacity="0.10" stroke-width="4"/>

  <!-- Right panel — community / GUYS -->
  <g clip-path="url(#rightClip)">
    <rect width="1280" height="880" fill="#e8d4b4"/>
    <!-- GUYS large -->
    <text x="770" y="380" font-family="'SF Pro Display','Helvetica Neue',Arial,sans-serif" font-size="208" font-weight="700" fill="#1e1208" letter-spacing="-0.04em">Guys</text>
    <!-- Car Wash below -->
    <text x="773" y="460" font-family="'SF Pro Display','Helvetica Neue',Arial,sans-serif" font-size="40" font-weight="300" fill="#6a4828" letter-spacing="0.12em">CAR WASH</text>
    <!-- Horizontal rule -->
    <line x1="770" y1="496" x2="1190" y2="496" stroke="#1e1208" stroke-opacity="0.15" stroke-width="1"/>
    <!-- Descriptor -->
    <text x="770" y="540" font-family="'SF Pro Display','Helvetica Neue',Arial,sans-serif" font-size="15" font-weight="400" fill="#6a4828" letter-spacing="0.06em">Community membership · Local identity</text>
  </g>

  <!-- Bottom strip -->
  <rect x="0" y="820" width="1280" height="60" fill="#1e1208" fill-opacity="0.06"/>
  <text x="90" y="857" font-family="'SF Pro Display','Helvetica Neue',Arial,sans-serif" font-size="11" font-weight="500" letter-spacing="0.20em" fill="#8a6040">BRAND STRATEGY · WEB DESIGN · 2026 · IN DEVELOPMENT</text>
</svg>
