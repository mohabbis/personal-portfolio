<svg width="640" height="400" viewBox="0 0 640 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="640" height="400" fill="#0a0a09"/>
  <rect width="640" height="400" fill="url(#lumenGlow)"/>

  <!-- Architectural grid overlay -->
  <g stroke="rgba(240,235,227,0.035)" stroke-width="1">
    <line x1="0" y1="80" x2="640" y2="80"/>
    <line x1="0" y1="160" x2="640" y2="160"/>
    <line x1="0" y1="240" x2="640" y2="240"/>
    <line x1="0" y1="320" x2="640" y2="320"/>
    <line x1="128" y1="0" x2="128" y2="400"/>
    <line x1="256" y1="0" x2="256" y2="400"/>
    <line x1="384" y1="0" x2="384" y2="400"/>
    <line x1="512" y1="0" x2="512" y2="400"/>
  </g>

  <!-- Asymmetric data rings (not concentric) -->
  <path d="M 320 200 m -128 0 a 128 128 0 0 1 128 -128" stroke="rgba(200,169,126,0.22)" stroke-width="1.5" fill="none"/>
  <path d="M 320 200 m -128 0 a 128 128 0 0 0 92 104" stroke="rgba(200,169,126,0.11)" stroke-width="1" fill="none"/>
  <ellipse cx="306" cy="192" rx="84" ry="80" stroke="rgba(200,169,126,0.18)" stroke-width="1" fill="none" stroke-dasharray="5 7"/>
  <circle cx="320" cy="200" r="40" stroke="rgba(200,169,126,0.3)" stroke-width="1.5" fill="rgba(200,169,126,0.04)"/>

  <!-- Core node -->
  <circle cx="320" cy="200" r="9" fill="rgba(200,169,126,0.6)"/>
  <circle cx="320" cy="200" r="15" stroke="rgba(200,169,126,0.25)" stroke-width="1.5" fill="none"/>

  <!-- Signal path -->
  <path d="M 320 200 L 432 128" stroke="rgba(200,169,126,0.08)" stroke-width="11" stroke-linecap="round"/>

  <!-- Labeled nodes -->
  <g font-family="ui-monospace, monospace" letter-spacing="0.08em">
    <circle cx="432" cy="128" r="6" fill="rgba(200,169,126,0.35)"/>
    <line x1="432" y1="128" x2="368" y2="168" stroke="rgba(200,169,126,0.18)" stroke-width="1"/>
    <text x="444" y="124" fill="rgba(200,169,126,0.5)" font-size="13">CYNC</text>

    <circle cx="232" cy="112" r="6" fill="rgba(200,169,126,0.25)"/>
    <line x1="232" y1="112" x2="288" y2="160" stroke="rgba(200,169,126,0.14)" stroke-width="1"/>
    <text x="150" y="108" fill="rgba(200,169,126,0.4)" font-size="13">MOTION</text>

    <circle cx="444" cy="272" r="6" fill="rgba(200,169,126,0.2)"/>
    <line x1="444" y1="272" x2="368" y2="224" stroke="rgba(200,169,126,0.12)" stroke-width="1"/>
    <text x="456" y="276" fill="rgba(200,169,126,0.38)" font-size="13">GOVEE</text>

    <circle cx="216" cy="288" r="6" fill="rgba(200,169,126,0.28)"/>
    <line x1="216" y1="288" x2="288" y2="232" stroke="rgba(200,169,126,0.14)" stroke-width="1"/>
    <text x="120" y="292" fill="rgba(200,169,126,0.42)" font-size="13">HOMEKIT</text>

    <circle cx="540" cy="56" r="6" fill="rgba(140,220,140,0.6)"/>
    <text x="554" y="60" fill="rgba(140,220,140,0.55)" font-size="13" letter-spacing="0.12em">LIVE</text>
  </g>

  <defs>
    <radialGradient id="lumenGlow" cx="0.5" cy="0.42" r="0.6">
      <stop offset="0" stop-color="rgba(200,169,126,0.12)"/>
      <stop offset="1" stop-color="rgba(200,169,126,0)"/>
    </radialGradient>
  </defs>
</svg>
