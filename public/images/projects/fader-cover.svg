<svg width="1600" height="1000" viewBox="0 0 1600 1000" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="fader-title">
  <title id="fader-title">Fader - per-app volume and output for macOS</title>
  <defs>
    <linearGradient id="fd-base" x1="0" y1="0" x2="0" y2="1000" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#161210"/>
      <stop offset="1" stop-color="#0c0a08"/>
    </linearGradient>
    <radialGradient id="fd-glow" cx="0.6" cy="0.4" r="0.6">
      <stop offset="0" stop-color="#d8994e" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#d8994e" stop-opacity="0"/>
    </radialGradient>
    <pattern id="fd-dots" width="34" height="34" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.5" fill="#f5efe4" fill-opacity="0.05"/>
    </pattern>
  </defs>

  <rect width="1600" height="1000" fill="url(#fd-base)"/>
  <rect width="1600" height="1000" fill="url(#fd-glow)"/>
  <rect width="1600" height="1000" fill="url(#fd-dots)" opacity="0.5"/>

  <text x="120" y="150" font-family="'SF Pro Display','Helvetica Neue',Arial,sans-serif" font-size="30" font-weight="500" letter-spacing="0.42em" fill="#f5efe4" fill-opacity="0.9">FADER</text>
  <text x="120" y="206" font-family="'SF Pro Display','Helvetica Neue',Arial,sans-serif" font-size="24" fill="#f5efe4" fill-opacity="0.45">Every app gets its own volume and output</text>

  <rect x="560" y="220" width="920" height="640" rx="34" fill="#f5efe4" fill-opacity="0.045" stroke="#f5efe4" stroke-opacity="0.09"/>
  <g>
    <text x="690" y="290" text-anchor="middle" font-family="'SF Pro Display','Helvetica Neue',Arial,sans-serif" font-size="24" font-weight="500" fill="#f5efe4" fill-opacity="0.88">Spotify</text>
    <path d="M690 330V730" stroke="#f5efe4" stroke-opacity="0.1" stroke-width="12" stroke-linecap="round"/>
    <path d="M690 442V730" stroke="#d8994e" stroke-width="12" stroke-linecap="round"/>
    <rect x="656" y="426" width="68" height="32" rx="10" fill="#f6d9a8"/>
    <text x="690" y="790" text-anchor="middle" font-family="'SF Pro Display','Helvetica Neue',Arial,sans-serif" font-size="19" fill="#f5efe4" fill-opacity="0.45">Headphones</text>
    <text x="880" y="290" text-anchor="middle" font-family="'SF Pro Display','Helvetica Neue',Arial,sans-serif" font-size="24" font-weight="500" fill="#f5efe4" fill-opacity="0.88">Safari</text>
    <path d="M880 330V730" stroke="#f5efe4" stroke-opacity="0.1" stroke-width="12" stroke-linecap="round"/>
    <path d="M880 538V730" stroke="#34c8a6" stroke-width="12" stroke-linecap="round"/>
    <rect x="846" y="522" width="68" height="32" rx="10" fill="#f6d9a8"/>
    <text x="880" y="790" text-anchor="middle" font-family="'SF Pro Display','Helvetica Neue',Arial,sans-serif" font-size="19" fill="#f5efe4" fill-opacity="0.45">Speakers</text>
    <text x="1070" y="290" text-anchor="middle" font-family="'SF Pro Display','Helvetica Neue',Arial,sans-serif" font-size="24" font-weight="500" fill="#f5efe4" fill-opacity="0.88">Zoom</text>
    <path d="M1070 330V730" stroke="#f5efe4" stroke-opacity="0.1" stroke-width="12" stroke-linecap="round"/>
    <path d="M1070 386V730" stroke="#d8994e" stroke-width="12" stroke-linecap="round"/>
    <rect x="1036" y="370" width="68" height="32" rx="10" fill="#f6d9a8"/>
    <text x="1070" y="790" text-anchor="middle" font-family="'SF Pro Display','Helvetica Neue',Arial,sans-serif" font-size="19" fill="#f5efe4" fill-opacity="0.45">Headphones</text>
    <path d="M1200 250V830" stroke="#f5efe4" stroke-opacity="0.08" stroke-width="1.5"/>
    <text x="1340" y="290" text-anchor="middle" font-family="'SF Pro Display','Helvetica Neue',Arial,sans-serif" font-size="24" font-weight="500" fill="#f5efe4" fill-opacity="0.88">Master</text>
    <path d="M1340 330V730" stroke="#f5efe4" stroke-opacity="0.1" stroke-width="12" stroke-linecap="round"/>
    <path d="M1340 474V730" stroke="#f0c286" stroke-width="12" stroke-linecap="round"/>
    <rect x="1306" y="458" width="68" height="32" rx="10" fill="#f6d9a8"/>
    <text x="1340" y="790" text-anchor="middle" font-family="'SF Pro Display','Helvetica Neue',Arial,sans-serif" font-size="19" fill="#f5efe4" fill-opacity="0.45">System</text>
  </g>

  <g>
    <rect x="120" y="520" width="380" height="330" rx="30" fill="#f5efe4" fill-opacity="0.05" stroke="#f5efe4" stroke-opacity="0.08"/>
    <text x="160" y="596" font-family="'SF Pro Display','Helvetica Neue',Arial,sans-serif" font-size="24" fill="#f5efe4" fill-opacity="0.55">Output</text>
    <rect x="160" y="630" width="300" height="60" rx="14" fill="#d8994e" fill-opacity="0.18" stroke="#d8994e" stroke-opacity="0.5"/>
    <text x="184" y="669" font-family="'SF Pro Display','Helvetica Neue',Arial,sans-serif" font-size="24" fill="#f5efe4" fill-opacity="0.9">Headphones</text>
    <rect x="160" y="706" width="300" height="60" rx="14" fill="#f5efe4" fill-opacity="0.04"/>
    <text x="184" y="745" font-family="'SF Pro Display','Helvetica Neue',Arial,sans-serif" font-size="24" fill="#f5efe4" fill-opacity="0.55">MacBook Speakers</text>
    <text x="160" y="812" font-family="'SF Pro Display','Helvetica Neue',Arial,sans-serif" font-size="20" fill="#f5efe4" fill-opacity="0.4">Falls back if unplugged</text>
  </g>

  <rect x="0.75" y="0.75" width="1598.5" height="998.5" fill="none" stroke="#f5efe4" stroke-opacity="0.06" stroke-width="1.5"/>
</svg>
