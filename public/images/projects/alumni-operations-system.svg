<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 880" role="img" aria-labelledby="ot od">
  <title id="ot">Organizational Strategy</title>
  <desc id="od">Financial analysis and strategic planning — editorial ledger thumbnail</desc>

  <!-- Background -->
  <rect width="1280" height="880" fill="#fdf6ec"/>

  <!-- Ruled ledger lines — full width, evenly spaced, very subtle -->
  <g stroke="#1e1208" stroke-opacity="0.07" stroke-width="1">
    <line x1="0" y1="220" x2="1280" y2="220"/>
    <line x1="0" y1="340" x2="1280" y2="340"/>
    <line x1="0" y1="460" x2="1280" y2="460"/>
    <line x1="0" y1="580" x2="1280" y2="580"/>
    <line x1="0" y1="700" x2="1280" y2="700"/>
  </g>

  <!-- Vertical column divider — right side -->
  <line x1="960" y1="200" x2="960" y2="720" stroke="#1e1208" stroke-opacity="0.10" stroke-width="1"/>

  <!-- Header eyebrow -->
  <text x="90" y="90" font-family="'SF Pro Display','Helvetica Neue',Arial,sans-serif" font-size="11" font-weight="500" letter-spacing="0.26em" fill="#a07848">ORGANIZATIONAL STRATEGY</text>

  <!-- Large title -->
  <text x="86" y="192" font-family="'SF Pro Display','Helvetica Neue',Arial,sans-serif" font-size="128" font-weight="700" fill="#1e1208" letter-spacing="-0.05em">Operations</text>

  <!-- Row 1: Budget -->
  <text x="90" y="298" font-family="'SF Pro Display','Helvetica Neue',Arial,sans-serif" font-size="13" font-weight="400" letter-spacing="0.18em" fill="#8a6040">01</text>
  <text x="140" y="298" font-family="'SF Pro Display','Helvetica Neue',Arial,sans-serif" font-size="20" font-weight="400" fill="#1e1208" letter-spacing="-0.01em">Budget &amp; Financial Position</text>
  <!-- Value bar -->
  <rect x="970" y="270" width="220" height="10" rx="5" fill="#1e1208" fill-opacity="0.08"/>
  <rect x="970" y="270" width="178" height="10" rx="5" fill="#d49238"/>
  <text x="970" y="313" font-family="'SF Pro Display','Helvetica Neue',Arial,sans-serif" font-size="12" fill="#a07848" letter-spacing="0.06em">89%</text>

  <!-- Row 2: Risk — accent -->
  <rect x="0" y="341" width="1280" height="118" fill="#d49238" fill-opacity="0.06"/>
  <text x="90" y="418" font-family="'SF Pro Display','Helvetica Neue',Arial,sans-serif" font-size="13" font-weight="400" letter-spacing="0.18em" fill="#8a6040">02</text>
  <text x="140" y="418" font-family="'SF Pro Display','Helvetica Neue',Arial,sans-serif" font-size="20" font-weight="500" fill="#1e1208" letter-spacing="-0.01em">Risk Management</text>
  <rect x="970" y="390" width="220" height="10" rx="5" fill="#1e1208" fill-opacity="0.08"/>
  <rect x="970" y="390" width="136" height="10" rx="5" fill="#d49238"/>
  <text x="970" y="433" font-family="'SF Pro Display','Helvetica Neue',Arial,sans-serif" font-size="12" fill="#a07848" letter-spacing="0.06em">62%</text>

  <!-- Row 3: Governance -->
  <text x="90" y="538" font-family="'SF Pro Display','Helvetica Neue',Arial,sans-serif" font-size="13" font-weight="400" letter-spacing="0.18em" fill="#8a6040">03</text>
  <text x="140" y="538" font-family="'SF Pro Display','Helvetica Neue',Arial,sans-serif" font-size="20" font-weight="400" fill="#1e1208" letter-spacing="-0.01em">Governance &amp; Compliance</text>
  <rect x="970" y="510" width="220" height="10" rx="5" fill="#1e1208" fill-opacity="0.08"/>
  <rect x="970" y="510" width="198" height="10" rx="5" fill="#d49238"/>
  <text x="970" y="553" font-family="'SF Pro Display','Helvetica Neue',Arial,sans-serif" font-size="12" fill="#a07848" letter-spacing="0.06em">90%</text>

  <!-- Row 4: Continuity -->
  <text x="90" y="658" font-family="'SF Pro Display','Helvetica Neue',Arial,sans-serif" font-size="13" font-weight="400" letter-spacing="0.18em" fill="#8a6040">04</text>
  <text x="140" y="658" font-family="'SF Pro Display','Helvetica Neue',Arial,sans-serif" font-size="20" font-weight="400" fill="#1e1208" letter-spacing="-0.01em">Institutional Continuity</text>
  <rect x="970" y="630" width="220" height="10" rx="5" fill="#1e1208" fill-opacity="0.08"/>
  <rect x="970" y="630" width="96" height="10" rx="5" fill="#d49238"/>
  <text x="970" y="673" font-family="'SF Pro Display','Helvetica Neue',Arial,sans-serif" font-size="12" fill="#a07848" letter-spacing="0.06em">44%</text>

  <!-- Bottom footer -->
  <line x1="90" y1="780" x2="1190" y2="780" stroke="#1e1208" stroke-opacity="0.12" stroke-width="1"/>
  <text x="90" y="820" font-family="'SF Pro Display','Helvetica Neue',Arial,sans-serif" font-size="11" font-weight="400" letter-spacing="0.18em" fill="#a07848">FINANCIAL ANALYSIS · STRATEGIC PLANNING · 2025</text>
  <text x="1190" y="820" font-family="'SF Pro Display','Helvetica Neue',Arial,sans-serif" font-size="11" font-weight="400" letter-spacing="0.08em" fill="#a07848" text-anchor="end">Student Organizations</text>
</svg>
