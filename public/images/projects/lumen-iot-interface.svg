<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 1320" role="img" aria-labelledby="title desc">
  <title id="title">Lumen interface</title>
  <desc id="desc">A polished smart-home phone interface showing a room scene, brightness control, sensors, and an automation queue.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#fbf4e8"/>
      <stop offset="0.55" stop-color="#f0dcc0"/>
      <stop offset="1" stop-color="#e7c79c"/>
    </linearGradient>
    <linearGradient id="frame" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#241a12"/>
      <stop offset="1" stop-color="#0c0805"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#fffaf2"/>
      <stop offset="1" stop-color="#f5e7d2"/>
    </linearGradient>
    <linearGradient id="hero" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#2c1d12"/>
      <stop offset="1" stop-color="#523620"/>
    </linearGradient>
    <linearGradient id="amber" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#f6cf7d"/>
      <stop offset="1" stop-color="#c97e2c"/>
    </linearGradient>
    <radialGradient id="bulb" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffd98a"/>
      <stop offset="1" stop-color="#ef9f33"/>
    </radialGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="30" stdDeviation="34" flood-color="#231203" flood-opacity="0.30"/>
    </filter>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="26"/>
    </filter>
  </defs>

  <!-- backdrop -->
  <rect width="880" height="1320" fill="url(#bg)"/>
  <circle cx="150" cy="180" r="230" fill="#f4bd66" opacity="0.30" filter="url(#glow)"/>
  <circle cx="760" cy="1080" r="300" fill="#f7d792" opacity="0.22" filter="url(#glow)"/>

  <!-- phone -->
  <g filter="url(#soft)">
    <rect x="196" y="70" width="488" height="1180" rx="78" fill="url(#frame)"/>
    <rect x="216" y="92" width="448" height="1136" rx="60" fill="url(#screen)"/>
    <rect x="372" y="120" width="136" height="20" rx="10" fill="#0c0805" opacity="0.7"/>

    <!-- header -->
    <g transform="translate(252 188)">
      <text x="0" y="0" fill="#241a12" font-family="SF Pro Display, Helvetica, Arial, sans-serif" font-size="40" font-weight="600">Lumen</text>
      <text x="0" y="40" fill="#8a6c4b" font-family="SF Pro Text, Helvetica, Arial, sans-serif" font-size="19">Studio · evening scene</text>
      <g transform="translate(288 -28)">
        <rect width="92" height="40" rx="20" fill="#c97e2c" opacity="0.16"/>
        <circle cx="22" cy="20" r="6" fill="#c97e2c"/>
        <text x="38" y="26" fill="#9c5f1f" font-family="SF Pro Text, Helvetica, Arial, sans-serif" font-size="15" font-weight="600">Beta</text>
      </g>
    </g>

    <!-- hero room card -->
    <g transform="translate(252 268)">
      <rect width="376" height="300" rx="40" fill="url(#hero)"/>
      <circle cx="300" cy="92" r="78" fill="#f0ab42" opacity="0.22" filter="url(#glow)"/>
      <circle cx="300" cy="92" r="34" fill="url(#bulb)"/>
      <text x="36" y="74" fill="#fff3dd" font-family="SF Pro Display, Helvetica, Arial, sans-serif" font-size="30" font-weight="500">Living room</text>
      <text x="36" y="108" fill="#d9c2a3" font-family="SF Pro Text, Helvetica, Arial, sans-serif" font-size="18">Warm white · active</text>

      <text x="36" y="222" fill="#fff3dd" font-family="SF Pro Display, Helvetica, Arial, sans-serif" font-size="84" font-weight="500">72</text>
      <text x="172" y="222" fill="#d9c2a3" font-family="SF Pro Display, Helvetica, Arial, sans-serif" font-size="38" font-weight="400">%</text>
      <text x="38" y="250" fill="#bfa583" font-family="SF Pro Text, Helvetica, Arial, sans-serif" font-size="17">brightness</text>

      <rect x="200" y="232" width="140" height="14" rx="7" fill="#ffffff" opacity="0.16"/>
      <rect x="200" y="232" width="100" height="14" rx="7" fill="url(#amber)"/>
    </g>

    <!-- two tiles -->
    <g transform="translate(252 600)">
      <rect width="178" height="150" rx="34" fill="#2a1b11"/>
      <text x="28" y="56" fill="#fff3dd" font-family="SF Pro Display, Helvetica, Arial, sans-serif" font-size="24" font-weight="500">Motion</text>
      <text x="28" y="86" fill="#d9c2a3" font-family="SF Pro Text, Helvetica, Arial, sans-serif" font-size="16">hallway</text>
      <rect x="28" y="104" width="74" height="28" rx="14" fill="#f0a23a"/>
      <circle cx="88" cy="118" r="9" fill="#fff3dd"/>

      <rect x="198" width="178" height="150" rx="34" fill="#fff7e9" stroke="#241a12" stroke-opacity="0.07"/>
      <text x="226" y="56" fill="#241a12" font-family="SF Pro Display, Helvetica, Arial, sans-serif" font-size="24" font-weight="500">Climate</text>
      <text x="226" y="110" fill="#241a12" font-family="SF Pro Display, Helvetica, Arial, sans-serif" font-size="48" font-weight="500">68°</text>
    </g>

    <!-- automation queue -->
    <g transform="translate(252 782)">
      <rect width="376" height="252" rx="40" fill="#fff7e9" stroke="#241a12" stroke-opacity="0.06"/>
      <text x="32" y="56" fill="#241a12" font-family="SF Pro Display, Helvetica, Arial, sans-serif" font-size="26" font-weight="500">Automations</text>
      <text x="32" y="84" fill="#8a6c4b" font-family="SF Pro Text, Helvetica, Arial, sans-serif" font-size="16">next 12 minutes</text>

      <g transform="translate(32 110)">
        <rect width="312" height="56" rx="20" fill="#2a1b11"/>
        <circle cx="32" cy="28" r="11" fill="#f0a23a"/>
        <text x="58" y="34" fill="#fff3dd" font-family="SF Pro Text, Helvetica, Arial, sans-serif" font-size="16">Lower lights when motion clears</text>
      </g>
      <g transform="translate(32 178)">
        <rect width="312" height="56" rx="20" fill="#ffffff" stroke="#241a12" stroke-opacity="0.08"/>
        <circle cx="32" cy="28" r="11" fill="#241a12" opacity="0.2"/>
        <text x="58" y="34" fill="#241a12" font-family="SF Pro Text, Helvetica, Arial, sans-serif" font-size="16">Restore scene before sunrise</text>
      </g>
    </g>

    <!-- protocol footer -->
    <g transform="translate(252 1066)">
      <rect width="376" height="118" rx="34" fill="#1d130d"/>
      <text x="32" y="50" fill="#fff3dd" font-family="SF Pro Display, Helvetica, Arial, sans-serif" font-size="22" font-weight="500">HomeKit · Govee · Cync</text>
      <text x="32" y="82" fill="#bfa583" font-family="SF Pro Text, Helvetica, Arial, sans-serif" font-size="16">connected through room-level logic</text>
    </g>
  </g>
</svg>
