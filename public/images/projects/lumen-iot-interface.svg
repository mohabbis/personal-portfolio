<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 880" role="img" aria-labelledby="title desc">
  <title id="title">Lumen smart-home interface</title>
  <desc id="desc">A polished smart-home product scene: a phone showing a room scene and brightness, alongside feature cards for rooms, automations, and connected protocols.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#fbf4e8"/>
      <stop offset="0.5" stop-color="#f0dcc0"/>
      <stop offset="1" stop-color="#e3c096"/>
    </linearGradient>
    <linearGradient id="frame" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#241a12"/>
      <stop offset="1" stop-color="#0c0805"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#fffaf2"/>
      <stop offset="1" stop-color="#f4e5cf"/>
    </linearGradient>
    <linearGradient id="hero" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#2c1d12"/>
      <stop offset="1" stop-color="#523620"/>
    </linearGradient>
    <linearGradient id="amber" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#f6cf7d"/>
      <stop offset="1" stop-color="#c97e2c"/>
    </linearGradient>
    <radialGradient id="bulb" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffd98a"/>
      <stop offset="1" stop-color="#ef9f33"/>
    </radialGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="26" stdDeviation="30" flood-color="#231203" flood-opacity="0.28"/>
    </filter>
    <filter id="card" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="16" stdDeviation="22" flood-color="#5a3a18" flood-opacity="0.16"/>
    </filter>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="30"/>
    </filter>
  </defs>

  <!-- backdrop -->
  <rect width="1280" height="880" fill="url(#bg)"/>
  <circle cx="240" cy="150" r="280" fill="#f4bd66" opacity="0.28" filter="url(#glow)"/>
  <circle cx="1120" cy="760" r="320" fill="#f7d792" opacity="0.20" filter="url(#glow)"/>

  <!-- eyebrow -->
  <g transform="translate(96 92)" font-family="SF Pro Text, Helvetica, Arial, sans-serif">
    <text x="0" y="0" fill="#8a6c4b" font-size="22" letter-spacing="3" font-weight="600">SMART HOME · BETA</text>
  </g>

  <!-- PHONE -->
  <g filter="url(#soft)" transform="translate(96 132)">
    <rect x="0" y="0" width="372" height="660" rx="62" fill="url(#frame)"/>
    <rect x="18" y="18" width="336" height="624" rx="46" fill="url(#screen)"/>
    <rect x="142" y="40" width="88" height="14" rx="7" fill="#0c0805" opacity="0.7"/>

    <!-- phone header -->
    <g transform="translate(46 92)">
      <text x="0" y="0" fill="#241a12" font-family="SF Pro Display, Helvetica, Arial, sans-serif" font-size="34" font-weight="600">Lumen</text>
      <text x="0" y="34" fill="#8a6c4b" font-family="SF Pro Text, Helvetica, Arial, sans-serif" font-size="16">Studio · evening scene</text>
    </g>

    <!-- hero room card -->
    <g transform="translate(46 218)">
      <rect width="280" height="232" rx="34" fill="url(#hero)"/>
      <circle cx="222" cy="74" r="62" fill="#f0ab42" opacity="0.22" filter="url(#glow)"/>
      <circle cx="222" cy="74" r="28" fill="url(#bulb)"/>
      <text x="28" y="60" fill="#fff3dd" font-family="SF Pro Display, Helvetica, Arial, sans-serif" font-size="24" font-weight="500">Living room</text>
      <text x="28" y="88" fill="#d9c2a3" font-family="SF Pro Text, Helvetica, Arial, sans-serif" font-size="15">Warm white · active</text>
      <text x="28" y="174" fill="#fff3dd" font-family="SF Pro Display, Helvetica, Arial, sans-serif" font-size="64" font-weight="500">72</text>
      <text x="132" y="174" fill="#d9c2a3" font-family="SF Pro Display, Helvetica, Arial, sans-serif" font-size="28">%</text>
      <text x="30" y="198" fill="#bfa583" font-family="SF Pro Text, Helvetica, Arial, sans-serif" font-size="14">brightness</text>
      <rect x="150" y="180" width="104" height="12" rx="6" fill="#ffffff" opacity="0.16"/>
      <rect x="150" y="180" width="74" height="12" rx="6" fill="url(#amber)"/>
    </g>

    <!-- bottom tile -->
    <g transform="translate(46 470)">
      <rect width="280" height="120" rx="30" fill="#fff7e9" stroke="#241a12" stroke-opacity="0.06"/>
      <circle cx="44" cy="60" r="22" fill="#f0a23a" opacity="0.18"/>
      <circle cx="44" cy="60" r="10" fill="#f0a23a"/>
      <text x="84" y="52" fill="#241a12" font-family="SF Pro Display, Helvetica, Arial, sans-serif" font-size="20" font-weight="500">Motion · hallway</text>
      <text x="84" y="80" fill="#8a6c4b" font-family="SF Pro Text, Helvetica, Arial, sans-serif" font-size="15">triggers evening scene</text>
    </g>
  </g>

  <!-- Beta badge floating on phone top-right -->
  <g transform="translate(360 150)">
    <rect width="96" height="40" rx="20" fill="#fff7e9" filter="url(#card)"/>
    <circle cx="24" cy="20" r="6" fill="#c97e2c"/>
    <text x="40" y="26" fill="#9c5f1f" font-family="SF Pro Text, Helvetica, Arial, sans-serif" font-size="15" font-weight="600">Beta</text>
  </g>

  <!-- RIGHT: feature cards -->
  <!-- Rooms & scenes -->
  <g filter="url(#card)" transform="translate(560 150)">
    <rect width="616" height="186" rx="34" fill="#fffaf2"/>
    <text x="36" y="58" fill="#241a12" font-family="SF Pro Display, Helvetica, Arial, sans-serif" font-size="26" font-weight="600">Rooms &amp; scenes</text>
    <text x="36" y="90" fill="#8a6c4b" font-family="SF Pro Text, Helvetica, Arial, sans-serif" font-size="16">Control by space and intent, not by device.</text>
    <g font-family="SF Pro Text, Helvetica, Arial, sans-serif" font-size="16" font-weight="500">
      <rect x="36" y="116" width="124" height="44" rx="22" fill="#2c1d12"/>
      <text x="98" y="144" fill="#fff3dd" text-anchor="middle">Living room</text>
      <rect x="176" y="116" width="96" height="44" rx="22" fill="#f0e2cb"/>
      <text x="224" y="144" fill="#5a3f24" text-anchor="middle">Studio</text>
      <rect x="288" y="116" width="104" height="44" rx="22" fill="#f0e2cb"/>
      <text x="340" y="144" fill="#5a3f24" text-anchor="middle">Bedroom</text>
      <rect x="408" y="116" width="92" height="44" rx="22" fill="#f0e2cb"/>
      <text x="454" y="144" fill="#5a3f24" text-anchor="middle">Kitchen</text>
    </g>
  </g>

  <!-- Automations -->
  <g filter="url(#card)" transform="translate(560 360)">
    <rect width="616" height="200" rx="34" fill="#fffaf2"/>
    <text x="36" y="56" fill="#241a12" font-family="SF Pro Display, Helvetica, Arial, sans-serif" font-size="26" font-weight="600">Automations</text>
    <g transform="translate(36 78)">
      <rect width="544" height="48" rx="18" fill="#2c1d12"/>
      <circle cx="30" cy="24" r="9" fill="#f0a23a"/>
      <text x="54" y="30" fill="#fff3dd" font-family="SF Pro Text, Helvetica, Arial, sans-serif" font-size="16">Lower lights when motion clears</text>
    </g>
    <g transform="translate(36 134)">
      <rect width="544" height="48" rx="18" fill="#f4e8d5"/>
      <circle cx="30" cy="24" r="9" fill="#241a12" opacity="0.22"/>
      <text x="54" y="30" fill="#5a3f24" font-family="SF Pro Text, Helvetica, Arial, sans-serif" font-size="16">Restore scene before sunrise</text>
    </g>
  </g>

  <!-- Connected protocols -->
  <g filter="url(#card)" transform="translate(560 584)">
    <rect width="616" height="160" rx="34" fill="url(#hero)"/>
    <text x="36" y="58" fill="#fff3dd" font-family="SF Pro Display, Helvetica, Arial, sans-serif" font-size="24" font-weight="600">One system layer</text>
    <text x="36" y="90" fill="#d9c2a3" font-family="SF Pro Text, Helvetica, Arial, sans-serif" font-size="16">Heterogeneous devices behind a single model.</text>
    <g font-family="SF Pro Text, Helvetica, Arial, sans-serif" font-size="16" font-weight="500">
      <rect x="36" y="108" width="120" height="42" rx="21" fill="#ffffff" opacity="0.12"/>
      <text x="96" y="135" fill="#fff3dd" text-anchor="middle">HomeKit</text>
      <rect x="170" y="108" width="104" height="42" rx="21" fill="#ffffff" opacity="0.12"/>
      <text x="222" y="135" fill="#fff3dd" text-anchor="middle">Govee</text>
      <rect x="288" y="108" width="96" height="42" rx="21" fill="#ffffff" opacity="0.12"/>
      <text x="336" y="135" fill="#fff3dd" text-anchor="middle">Cync</text>
      <rect x="398" y="108" width="104" height="42" rx="21" fill="#ffffff" opacity="0.12"/>
      <text x="450" y="135" fill="#fff3dd" text-anchor="middle">Matter</text>
    </g>
  </g>
</svg>
