<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 880" role="img" aria-labelledby="lt ld">
  <title id="lt">Lumen</title>
  <desc id="ld">Lumen smart-home interface — editorial product thumbnail</desc>
  <defs>
    <radialGradient id="bg" cx="68%" cy="52%" r="72%">
      <stop offset="0%" stop-color="#2e1a08"/>
      <stop offset="100%" stop-color="#0e0804"/>
    </radialGradient>
    <radialGradient id="orb" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffe8a0"/>
      <stop offset="40%" stop-color="#f7b93a"/>
      <stop offset="100%" stop-color="#a05810" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f7b93a" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#f7b93a" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1280" height="880" fill="url(#bg)"/>

  <!-- Outer halo glow -->
  <circle cx="860" cy="440" r="420" fill="url(#halo)"/>

  <!-- Concentric dial rings — very faint -->
  <g fill="none" stroke="#f7b93a" stroke-opacity="0.07">
    <circle cx="860" cy="440" r="340"/>
    <circle cx="860" cy="440" r="290"/>
    <circle cx="860" cy="440" r="240"/>
    <circle cx="860" cy="440" r="192"/>
  </g>

  <!-- Radial tick marks around the dial -->
  <g stroke="#f7b93a" stroke-opacity="0.14" stroke-width="1.5">
    <line x1="860" y1="100" x2="860" y2="130"/>
    <line x1="1017" y1="153" x2="1000" y2="177"/>
    <line x1="1107" y1="283" x2="1086" y2="296"/>
    <line x1="1137" y1="440" x2="1107" y2="440"/>
    <line x1="1107" y1="597" x2="1086" y2="584"/>
    <line x1="1017" y1="727" x2="1000" y2="703"/>
    <line x1="860" y1="780" x2="860" y2="750"/>
    <line x1="703" y1="727" x2="720" y2="703"/>
    <line x1="613" y1="597" x2="634" y2="584"/>
    <line x1="583" y1="440" x2="613" y2="440"/>
    <line x1="613" y1="283" x2="634" y2="296"/>
    <line x1="703" y1="153" x2="720" y2="177"/>
  </g>

  <!-- Orb -->
  <circle cx="860" cy="440" r="168" fill="url(#orb)"/>
  <!-- Orb inner bright core -->
  <circle cx="860" cy="440" r="72" fill="#fff8e0" fill-opacity="0.9"/>
  <circle cx="852" cy="432" r="28" fill="#ffffff"/>

  <!-- 72% — large typographic number -->
  <text x="112" y="548" font-family="'SF Pro Display','Helvetica Neue',Arial,sans-serif" font-size="288" font-weight="700" fill="#fff5e0" fill-opacity="0.06" letter-spacing="-0.06em">72</text>

  <!-- LUMEN wordmark -->
  <text x="96" y="138" font-family="'SF Pro Display','Helvetica Neue',Arial,sans-serif" font-size="13" font-weight="500" letter-spacing="0.28em" fill="#c8a060">LUMEN</text>

  <!-- Subtitle -->
  <text x="96" y="224" font-family="'SF Pro Display','Helvetica Neue',Arial,sans-serif" font-size="96" font-weight="600" fill="#fff5e0" letter-spacing="-0.045em">Living room</text>
  <text x="96" y="308" font-family="'SF Pro Display','Helvetica Neue',Arial,sans-serif" font-size="40" font-weight="300" fill="#c8a060" letter-spacing="-0.02em">evening scene</text>

  <!-- Brightness label -->
  <text x="96" y="432" font-family="'SF Pro Display','Helvetica Neue',Arial,sans-serif" font-size="168" font-weight="700" fill="#fff5e0" letter-spacing="-0.055em">72<tspan font-size="80" fill="#c8a060" baseline-shift="-12">%</tspan></text>
  <text x="98" y="480" font-family="'SF Pro Display','Helvetica Neue',Arial,sans-serif" font-size="11" font-weight="400" letter-spacing="0.22em" fill="#a07848" fill-opacity="0.8">BRIGHTNESS</text>

  <!-- Divider line -->
  <line x1="96" y1="530" x2="460" y2="530" stroke="#c8a060" stroke-opacity="0.25" stroke-width="1"/>

  <!-- Protocol list -->
  <text x="96" y="570" font-family="'SF Pro Display','Helvetica Neue',Arial,sans-serif" font-size="13" font-weight="400" letter-spacing="0.14em" fill="#906040" fill-opacity="0.9">HomeKit · Govee · GE Cync · Matter</text>

  <!-- Status dot + label -->
  <circle cx="96" cy="634" r="5" fill="#f7b93a"/>
  <text x="112" y="639" font-family="'SF Pro Display','Helvetica Neue',Arial,sans-serif" font-size="13" font-weight="400" letter-spacing="0.10em" fill="#c8a060" fill-opacity="0.7">IN DEVELOPMENT · 2026</text>
</svg>
