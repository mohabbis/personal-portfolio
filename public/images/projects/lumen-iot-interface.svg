<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1800" role="img" aria-labelledby="title desc">
  <title id="title">Lumen interface artwork</title>
  <desc id="desc">A polished smart-home interface artwork with warm room controls, device states, and automation details.</desc>
  <defs>
    <linearGradient id="wall" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#fff6e8"/><stop offset="0.5" stop-color="#e4c29a"/><stop offset="1" stop-color="#17100b"/></linearGradient>
    <linearGradient id="phone" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#2d2118"/><stop offset="1" stop-color="#070504"/></linearGradient>
    <linearGradient id="screen" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#fdf2df"/><stop offset="0.58" stop-color="#eac99b"/><stop offset="1" stop-color="#2a1a11"/></linearGradient>
    <linearGradient id="glass" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#fffaf0" stop-opacity="0.92"/><stop offset="1" stop-color="#fffaf0" stop-opacity="0.35"/></linearGradient>
    <linearGradient id="amber" x1="0" x2="1"><stop offset="0" stop-color="#f5cf78"/><stop offset="1" stop-color="#c8772c"/></linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="34" stdDeviation="34" flood-color="#1c1008" flood-opacity="0.28"/></filter>
    <filter id="blur"><feGaussianBlur stdDeviation="30"/></filter>
    <pattern id="grain" width="90" height="90" patternUnits="userSpaceOnUse"><path d="M0 21h90M0 47h90M0 73h90" stroke="#6b4426" stroke-opacity="0.06"/><path d="M16 0v90M52 0v90M80 0v90" stroke="#ffffff" stroke-opacity="0.06"/></pattern>
  </defs>

  <rect width="900" height="1800" fill="url(#wall)"/>
  <rect width="900" height="1800" fill="url(#grain)" opacity="0.65"/>
  <circle cx="160" cy="210" r="240" fill="#f0b35d" opacity="0.32" filter="url(#blur)"/>
  <circle cx="770" cy="1270" r="360" fill="#f6d58b" opacity="0.19" filter="url(#blur)"/>
  <rect x="72" y="112" width="756" height="1580" rx="80" fill="#ffffff" opacity="0.16"/>

  <g filter="url(#shadow)">
    <rect x="184" y="96" width="532" height="1608" rx="86" fill="url(#phone)"/>
    <rect x="208" y="126" width="484" height="1548" rx="66" fill="url(#screen)"/>
    <rect x="365" y="151" width="170" height="24" rx="12" fill="#16100c" opacity="0.76"/>

    <g transform="translate(244 210)">
      <text x="0" y="0" fill="#2b1d12" font-family="SF Pro Display, Helvetica, Arial, sans-serif" font-size="42" font-weight="600">Lumen</text>
      <text x="0" y="46" fill="#7c6246" font-family="SF Pro Text, Helvetica, Arial, sans-serif" font-size="21">Studio · evening scene</text>
      <rect x="318" y="-24" width="106" height="44" rx="22" fill="#2b1d12" opacity="0.9"/>
      <text x="371" y="5" fill="#fff2dc" text-anchor="middle" font-family="SF Pro Text, Helvetica, Arial, sans-serif" font-size="17">LIVE</text>
    </g>

    <g transform="translate(244 332)">
      <rect width="412" height="420" rx="46" fill="url(#glass)" stroke="#fff" stroke-opacity="0.55"/>
      <path d="M0 275 C115 210 245 330 412 240 V420 H0 Z" fill="#2a1b11" opacity="0.12"/>
      <rect x="36" y="46" width="340" height="164" rx="34" fill="#24170f" opacity="0.92"/>
      <circle cx="306" cy="128" r="54" fill="#f0ab42" opacity="0.26"/>
      <circle cx="306" cy="128" r="28" fill="#ed9c32"/>
      <text x="66" y="108" fill="#fff3dd" font-family="SF Pro Display, Helvetica, Arial, sans-serif" font-size="34" font-weight="500">Living room</text>
      <text x="66" y="151" fill="#d7c0a1" font-family="SF Pro Text, Helvetica, Arial, sans-serif" font-size="20">Warm light active</text>
      <text x="42" y="292" fill="#2b1d12" font-family="SF Pro Display, Helvetica, Arial, sans-serif" font-size="102" font-weight="500">72%</text>
      <text x="48" y="340" fill="#7c6246" font-family="SF Pro Text, Helvetica, Arial, sans-serif" font-size="21">brightness</text>
      <rect x="202" y="304" width="150" height="16" rx="8" fill="#2b1d12" opacity="0.13"/>
      <rect x="202" y="304" width="112" height="16" rx="8" fill="url(#amber)"/>
    </g>

    <g transform="translate(244 790)">
      <rect width="190" height="174" rx="38" fill="#2a1b11" opacity="0.94"/>
      <text x="32" y="62" fill="#fff3dd" font-family="SF Pro Display, Helvetica, Arial, sans-serif" font-size="26">Motion</text>
      <text x="32" y="98" fill="#d7c0a1" font-family="SF Pro Text, Helvetica, Arial, sans-serif" font-size="17">hallway</text>
      <rect x="32" y="122" width="86" height="30" rx="15" fill="#f0a23a"/>
      <circle cx="102" cy="137" r="10" fill="#fff3dd"/>

      <rect x="222" width="190" height="174" rx="38" fill="#fff7e9" opacity="0.72" stroke="#2a1b11" stroke-opacity="0.08"/>
      <text x="254" y="62" fill="#2a1b11" font-family="SF Pro Display, Helvetica, Arial, sans-serif" font-size="26">Climate</text>
      <text x="254" y="112" fill="#2a1b11" font-family="SF Pro Display, Helvetica, Arial, sans-serif" font-size="54">68°</text>
    </g>

    <g transform="translate(244 1008)">
      <rect width="412" height="372" rx="46" fill="#fff7e9" opacity="0.75" stroke="#fff" stroke-opacity="0.45"/>
      <text x="34" y="64" fill="#2b1d12" font-family="SF Pro Display, Helvetica, Arial, sans-serif" font-size="32" font-weight="500">Automation queue</text>
      <text x="34" y="105" fill="#7c6246" font-family="SF Pro Text, Helvetica, Arial, sans-serif" font-size="19">next 12 minutes</text>
      <g transform="translate(34 145)">
        <rect width="344" height="68" rx="25" fill="#2b1d12" opacity="0.92"/>
        <circle cx="36" cy="34" r="13" fill="#f0a23a"/>
        <text x="68" y="41" fill="#fff3dd" font-family="SF Pro Text, Helvetica, Arial, sans-serif" font-size="18">Lower lights when motion clears</text>
      </g>
      <g transform="translate(34 235)">
        <rect width="344" height="68" rx="25" fill="#ffffff" opacity="0.7"/>
        <circle cx="36" cy="34" r="13" fill="#2b1d12" opacity="0.22"/>
        <text x="68" y="41" fill="#2b1d12" font-family="SF Pro Text, Helvetica, Arial, sans-serif" font-size="18">Restore scene before sunrise</text>
      </g>
    </g>

    <g transform="translate(244 1432)">
      <rect width="412" height="144" rx="42" fill="#1d130d" opacity="0.9"/>
      <text x="34" y="58" fill="#fff3dd" font-family="SF Pro Display, Helvetica, Arial, sans-serif" font-size="27">HomeKit · Govee · Cync</text>
      <text x="34" y="96" fill="#d7c0a1" font-family="SF Pro Text, Helvetica, Arial, sans-serif" font-size="18">connected through room-level logic</text>
    </g>
  </g>
</svg>
