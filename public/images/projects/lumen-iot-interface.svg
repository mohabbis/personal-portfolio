<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1800" role="img" aria-labelledby="title desc">
  <title id="title">Lumen IoT interface concept</title>
  <desc id="desc">A warm editorial smart-home dashboard with room lighting, motion state, device controls, and automation timing.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#f7efe2"/>
      <stop offset="0.48" stop-color="#ead8bf"/>
      <stop offset="1" stop-color="#19120d"/>
    </linearGradient>
    <linearGradient id="card" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#fffaf1" stop-opacity="0.92"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.58"/>
    </linearGradient>
    <linearGradient id="dark" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#2b2118"/>
      <stop offset="1" stop-color="#0d0a08"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="28" stdDeviation="32" flood-color="#2b1d10" flood-opacity="0.22"/>
    </filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="30"/>
    </filter>
  </defs>
  <rect width="900" height="1800" fill="url(#bg)"/>
  <circle cx="220" cy="230" r="210" fill="#d18b3a" opacity="0.26" filter="url(#soft)"/>
  <circle cx="720" cy="1320" r="300" fill="#f4c977" opacity="0.18" filter="url(#soft)"/>

  <g transform="translate(70 86)">
    <text x="0" y="0" fill="#2b2118" font-family="SF Pro Display, Helvetica, Arial, sans-serif" font-size="34" font-weight="500">Lumen</text>
    <text x="0" y="48" fill="#6f5a43" font-family="SF Pro Text, Helvetica, Arial, sans-serif" font-size="22">Evening system</text>
    <text x="612" y="6" fill="#2b2118" font-family="SF Pro Text, Helvetica, Arial, sans-serif" font-size="22" text-anchor="end">8:42</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="70" y="210" width="760" height="430" rx="54" fill="url(#card)" stroke="#ffffff" stroke-opacity="0.62"/>
    <text x="120" y="286" fill="#2b2118" font-family="SF Pro Display, Helvetica, Arial, sans-serif" font-size="42" font-weight="500">Living Room</text>
    <text x="120" y="330" fill="#76634e" font-family="SF Pro Text, Helvetica, Arial, sans-serif" font-size="22">Warm scene · motion aware</text>
    <circle cx="690" cy="315" r="74" fill="#f2b04f" opacity="0.28"/>
    <circle cx="690" cy="315" r="47" fill="#f0a542"/>
    <path d="M671 315h38M690 296v38" stroke="#fff7e8" stroke-width="12" stroke-linecap="round"/>
    <rect x="120" y="418" width="540" height="18" rx="9" fill="#2b2118" opacity="0.1"/>
    <rect x="120" y="418" width="392" height="18" rx="9" fill="#c88735"/>
    <text x="120" y="498" fill="#2b2118" font-family="SF Pro Display, Helvetica, Arial, sans-serif" font-size="96" font-weight="500">72%</text>
    <text x="120" y="550" fill="#76634e" font-family="SF Pro Text, Helvetica, Arial, sans-serif" font-size="24">Brightness</text>
    <rect x="520" y="490" width="210" height="62" rx="31" fill="#2b2118"/>
    <text x="625" y="531" fill="#fff7e8" font-family="SF Pro Text, Helvetica, Arial, sans-serif" font-size="24" text-anchor="middle">Scene active</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="70" y="690" width="345" height="300" rx="42" fill="url(#card)" stroke="#ffffff" stroke-opacity="0.54"/>
    <text x="116" y="760" fill="#2b2118" font-family="SF Pro Display, Helvetica, Arial, sans-serif" font-size="31" font-weight="500">Motion</text>
    <text x="116" y="805" fill="#76634e" font-family="SF Pro Text, Helvetica, Arial, sans-serif" font-size="20">Hallway logic</text>
    <rect x="116" y="870" width="160" height="70" rx="35" fill="#1d1712"/>
    <circle cx="241" cy="905" r="26" fill="#f3b352"/>
    <text x="116" y="1058" fill="#2b2118" font-family="SF Pro Text, Helvetica, Arial, sans-serif" font-size="20">Armed until sunrise</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="455" y="690" width="375" height="300" rx="42" fill="url(#dark)" stroke="#ffffff" stroke-opacity="0.16"/>
    <text x="501" y="760" fill="#f8efe1" font-family="SF Pro Display, Helvetica, Arial, sans-serif" font-size="31" font-weight="500">Climate</text>
    <text x="501" y="805" fill="#c9b89f" font-family="SF Pro Text, Helvetica, Arial, sans-serif" font-size="20">Bedroom</text>
    <text x="501" y="918" fill="#f8efe1" font-family="SF Pro Display, Helvetica, Arial, sans-serif" font-size="86" font-weight="500">68°</text>
    <text x="501" y="974" fill="#c9b89f" font-family="SF Pro Text, Helvetica, Arial, sans-serif" font-size="20">Quiet mode</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="70" y="1040" width="760" height="560" rx="54" fill="rgba(255,250,241,0.84)" stroke="#ffffff" stroke-opacity="0.48"/>
    <text x="120" y="1120" fill="#2b2118" font-family="SF Pro Display, Helvetica, Arial, sans-serif" font-size="38" font-weight="500">Room map</text>
    <text x="120" y="1165" fill="#76634e" font-family="SF Pro Text, Helvetica, Arial, sans-serif" font-size="21">Device states routed through Muhome</text>
    <g transform="translate(120 1235)">
      <rect x="0" y="0" width="285" height="140" rx="32" fill="#2b2118" opacity="0.94"/>
      <text x="32" y="58" fill="#fff7e8" font-family="SF Pro Display, Helvetica, Arial, sans-serif" font-size="26">Studio</text>
      <text x="32" y="98" fill="#c9b89f" font-family="SF Pro Text, Helvetica, Arial, sans-serif" font-size="18">4 devices · active</text>
      <circle cx="238" cy="70" r="24" fill="#f1aa49"/>
    </g>
    <g transform="translate(445 1235)">
      <rect x="0" y="0" width="285" height="140" rx="32" fill="#ffffff" opacity="0.72" stroke="#2b2118" stroke-opacity="0.08"/>
      <text x="32" y="58" fill="#2b2118" font-family="SF Pro Display, Helvetica, Arial, sans-serif" font-size="26">Bedroom</text>
      <text x="32" y="98" fill="#76634e" font-family="SF Pro Text, Helvetica, Arial, sans-serif" font-size="18">2 devices · idle</text>
      <circle cx="238" cy="70" r="24" fill="#2b2118" opacity="0.14"/>
    </g>
    <g transform="translate(120 1410)">
      <rect x="0" y="0" width="610" height="92" rx="32" fill="#ffffff" opacity="0.66" stroke="#2b2118" stroke-opacity="0.08"/>
      <text x="32" y="56" fill="#2b2118" font-family="SF Pro Text, Helvetica, Arial, sans-serif" font-size="22">Next automation: lower lights when motion clears</text>
    </g>
  </g>

  <text x="70" y="1695" fill="#f8efe1" opacity="0.72" font-family="SF Pro Text, Helvetica, Arial, sans-serif" font-size="19">HomeKit · Govee · Cync · Motion · Scenes</text>
</svg>
