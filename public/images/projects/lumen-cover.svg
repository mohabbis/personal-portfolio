<svg width="1600" height="1000" viewBox="0 0 1600 1000" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="lumen-title">
  <title id="lumen-title">Lumen - a calm home companion</title>
  <defs>
    <linearGradient id="lm-base" x1="0" y1="0" x2="0" y2="1000" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#161210"/>
      <stop offset="1" stop-color="#0c0a08"/>
    </linearGradient>
    <radialGradient id="lm-lamp" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#f0bd77"/>
      <stop offset="0.45" stop-color="#d8994e"/>
      <stop offset="1" stop-color="#d8994e" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="lm-glow" cx="0.32" cy="0.26" r="0.6">
      <stop offset="0" stop-color="#d8994e" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#d8994e" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="lm-slider" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#d8994e"/>
      <stop offset="1" stop-color="#f0c286"/>
    </linearGradient>
    <filter id="lm-soft" x="900" y="20" width="560" height="560" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="46"/>
    </filter>
    <pattern id="lm-dots" width="34" height="34" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.5" fill="#f5efe4" fill-opacity="0.05"/>
    </pattern>
  </defs>

  <rect width="1600" height="1000" fill="url(#lm-base)"/>
  <rect width="1600" height="1000" fill="url(#lm-glow)"/>
  <rect width="1600" height="1000" fill="url(#lm-dots)" opacity="0.5"/>

  <text x="120" y="150" font-family="'SF Pro Display','Helvetica Neue',Arial,sans-serif" font-size="30" font-weight="500" letter-spacing="0.42em" fill="#f5efe4" fill-opacity="0.9">LUMEN</text>

  <g filter="url(#lm-soft)">
    <circle cx="1180" cy="300" r="180" fill="url(#lm-lamp)" opacity="0.9"/>
  </g>
  <circle cx="1180" cy="300" r="86" fill="#f3c98d" fill-opacity="0.16" stroke="#f0bd77" stroke-opacity="0.5" stroke-width="1.5"/>
  <circle cx="1180" cy="300" r="18" fill="#f6d9a8"/>

  <g>
    <rect x="120" y="260" width="640" height="200" rx="34" fill="#f5efe4" fill-opacity="0.045" stroke="#f5efe4" stroke-opacity="0.09"/>
    <text x="164" y="332" font-family="'SF Pro Display','Helvetica Neue',Arial,sans-serif" font-size="26" fill="#f5efe4" fill-opacity="0.62">Brightness</text>
    <text x="164" y="404" font-family="'SF Pro Display','Helvetica Neue',Arial,sans-serif" font-size="60" font-weight="600" fill="#f5efe4" letter-spacing="-0.02em">72<tspan font-size="30" fill-opacity="0.55">%</tspan></text>
    <rect x="340" y="378" width="380" height="14" rx="7" fill="#f5efe4" fill-opacity="0.1"/>
    <rect x="340" y="378" width="274" height="14" rx="7" fill="url(#lm-slider)"/>
    <circle cx="614" cy="385" r="18" fill="#f6d9a8"/>
  </g>

  <g>
    <rect x="120" y="520" width="300" height="330" rx="30" fill="#f5efe4" fill-opacity="0.05" stroke="#f5efe4" stroke-opacity="0.08"/>
    <circle cx="180" cy="588" r="24" fill="#d8994e" fill-opacity="0.24" stroke="#d8994e" stroke-opacity="0.55"/>
    <text x="150" y="700" font-family="'SF Pro Display',Arial,sans-serif" font-size="30" font-weight="500" fill="#f5efe4" fill-opacity="0.9">Wind Down</text>
    <text x="150" y="742" font-family="'SF Pro Display',Arial,sans-serif" font-size="22" fill="#f5efe4" fill-opacity="0.45">Warm and dim</text>

    <rect x="452" y="520" width="300" height="330" rx="30" fill="#f5efe4" fill-opacity="0.05" stroke="#f5efe4" stroke-opacity="0.08"/>
    <circle cx="512" cy="588" r="24" fill="#34c8a6" fill-opacity="0.22" stroke="#34c8a6" stroke-opacity="0.5"/>
    <text x="482" y="700" font-family="'SF Pro Display',Arial,sans-serif" font-size="30" font-weight="500" fill="#f5efe4" fill-opacity="0.9">Focus</text>
    <text x="482" y="742" font-family="'SF Pro Display',Arial,sans-serif" font-size="22" fill="#f5efe4" fill-opacity="0.45">Cool and steady</text>
  </g>

  <g>
    <rect x="1000" y="520" width="480" height="330" rx="34" fill="#f5efe4" fill-opacity="0.045" stroke="#f5efe4" stroke-opacity="0.09"/>
    <text x="1044" y="588" font-family="'SF Pro Display',Arial,sans-serif" font-size="24" fill="#f5efe4" fill-opacity="0.55">Atmosphere</text>
    <g stroke-linecap="round" stroke-width="10" fill="none">
      <path d="M1044 672H1436" stroke="#f5efe4" stroke-opacity="0.1"/>
      <path d="M1044 672H1300" stroke="#d8994e"/>
      <path d="M1044 736H1436" stroke="#f5efe4" stroke-opacity="0.1"/>
      <path d="M1044 736H1210" stroke="#34c8a6" stroke-opacity="0.8"/>
      <path d="M1044 800H1436" stroke="#f5efe4" stroke-opacity="0.1"/>
      <path d="M1044 800H1360" stroke="#d8994e" stroke-opacity="0.7"/>
    </g>
  </g>

  <rect x="0.75" y="0.75" width="1598.5" height="998.5" fill="none" stroke="#f5efe4" stroke-opacity="0.06" stroke-width="1.5"/>
</svg>
