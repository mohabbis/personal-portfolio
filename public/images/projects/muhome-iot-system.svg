<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">Lumen automation architecture artwork</title>
  <desc id="desc">A refined automation architecture artwork showing Lumen connected to rooms, device platforms, motion, scenes, and infrastructure.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#fbf1e2"/><stop offset="0.48" stop-color="#d2a675"/><stop offset="1" stop-color="#17100b"/></linearGradient>
    <linearGradient id="dark" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#2d2118"/><stop offset="1" stop-color="#080504"/></linearGradient>
    <linearGradient id="paper" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#fff8eb" stop-opacity="0.94"/><stop offset="1" stop-color="#fff8eb" stop-opacity="0.42"/></linearGradient>
    <linearGradient id="amber" x1="0" x2="1"><stop offset="0" stop-color="#f8d178"/><stop offset="1" stop-color="#c8772c"/></linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="26" stdDeviation="30" flood-color="#1a0f08" flood-opacity="0.22"/></filter>
    <filter id="soft"><feGaussianBlur stdDeviation="28"/></filter>
    <pattern id="grid" width="80" height="80" patternUnits="userSpaceOnUse"><path d="M80 0H0V80" fill="none" stroke="#fff" stroke-opacity="0.08"/><path d="M40 0V80M0 40H80" stroke="#22150c" stroke-opacity="0.05"/></pattern>
  </defs>

  <rect width="1600" height="1000" fill="url(#bg)"/>
  <rect width="1600" height="1000" fill="url(#grid)"/>
  <circle cx="250" cy="170" r="240" fill="#f0b35d" opacity="0.22" filter="url(#soft)"/>
  <circle cx="1330" cy="825" r="350" fill="#f6d58b" opacity="0.18" filter="url(#soft)"/>

  <g transform="translate(100 82)">
    <text x="0" y="0" fill="#24170f" font-family="SF Pro Display, Helvetica, Arial, sans-serif" font-size="58" font-weight="600">Lumen architecture</text>
    <text x="0" y="52" fill="#71533b" font-family="SF Pro Text, Helvetica, Arial, sans-serif" font-size="24">rooms · scenes · devices · motion · infrastructure</text>
  </g>

  <g stroke="#3b2415" stroke-opacity="0.23" stroke-width="3" fill="none">
    <path d="M800 220V132"/>
    <path d="M800 590V760"/>
    <path d="M595 405H378"/>
    <path d="M1005 405h216"/>
    <path d="M660 560L445 735"/>
    <path d="M940 560l215 175"/>
  </g>

  <g filter="url(#shadow)">
    <rect x="595" y="220" width="410" height="370" rx="64" fill="url(#dark)"/>
    <circle cx="800" cy="372" r="112" fill="#f0a23a" opacity="0.16"/>
    <circle cx="800" cy="372" r="54" fill="url(#amber)"/>
    <path d="M775 372h50M800 347v50" stroke="#fff5e0" stroke-width="15" stroke-linecap="round"/>
    <text x="800" y="502" text-anchor="middle" fill="#fff3dd" font-family="SF Pro Display, Helvetica, Arial, sans-serif" font-size="54" font-weight="600">Lumen</text>
    <text x="800" y="548" text-anchor="middle" fill="#d7c0a1" font-family="SF Pro Text, Helvetica, Arial, sans-serif" font-size="22">interface + automation layer</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="606" y="88" width="388" height="132" rx="44" fill="url(#paper)" stroke="#fff" stroke-opacity="0.5"/>
    <text x="800" y="148" text-anchor="middle" fill="#24170f" font-family="SF Pro Display, Helvetica, Arial, sans-serif" font-size="33" font-weight="600">Room logic</text>
    <text x="800" y="185" text-anchor="middle" fill="#71533b" font-family="SF Pro Text, Helvetica, Arial, sans-serif" font-size="19">time · occupancy · brightness</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="108" y="290" width="270" height="230" rx="48" fill="url(#paper)" stroke="#fff" stroke-opacity="0.5"/>
    <text x="150" y="366" fill="#24170f" font-family="SF Pro Display, Helvetica, Arial, sans-serif" font-size="34" font-weight="600">HomeKit</text>
    <text x="150" y="405" fill="#71533b" font-family="SF Pro Text, Helvetica, Arial, sans-serif" font-size="19">scene source</text>
    <rect x="150" y="450" width="160" height="16" rx="8" fill="#24170f" opacity="0.1"/><rect x="150" y="450" width="116" height="16" rx="8" fill="url(#amber)"/>
  </g>

  <g filter="url(#shadow)">
    <rect x="1221" y="290" width="270" height="230" rx="48" fill="url(#paper)" stroke="#fff" stroke-opacity="0.5"/>
    <text x="1263" y="366" fill="#24170f" font-family="SF Pro Display, Helvetica, Arial, sans-serif" font-size="34" font-weight="600">Devices</text>
    <text x="1263" y="405" fill="#71533b" font-family="SF Pro Text, Helvetica, Arial, sans-serif" font-size="19">Govee · Cync</text>
    <circle cx="1320" cy="468" r="22" fill="#f0a23a"/><circle cx="1380" cy="468" r="22" fill="#24170f" opacity="0.16"/><circle cx="1440" cy="468" r="22" fill="#f6d58b"/>
  </g>

  <g filter="url(#shadow)">
    <rect x="207" y="690" width="286" height="208" rx="48" fill="url(#paper)" stroke="#fff" stroke-opacity="0.46"/>
    <text x="250" y="765" fill="#24170f" font-family="SF Pro Display, Helvetica, Arial, sans-serif" font-size="33" font-weight="600">Motion</text>
    <text x="250" y="803" fill="#71533b" font-family="SF Pro Text, Helvetica, Arial, sans-serif" font-size="19">sensor events</text>
    <path d="M250 850 C300 820 350 870 425 830" stroke="#24170f" stroke-opacity="0.38" stroke-width="7" stroke-linecap="round" stroke-dasharray="1 20" fill="none"/>
  </g>

  <g filter="url(#shadow)">
    <rect x="1107" y="690" width="286" height="208" rx="48" fill="url(#paper)" stroke="#fff" stroke-opacity="0.46"/>
    <text x="1150" y="765" fill="#24170f" font-family="SF Pro Display, Helvetica, Arial, sans-serif" font-size="33" font-weight="600">Scenes</text>
    <text x="1150" y="803" fill="#71533b" font-family="SF Pro Text, Helvetica, Arial, sans-serif" font-size="19">dim · restore · pause</text>
    <rect x="1150" y="842" width="185" height="18" rx="9" fill="#24170f" opacity="0.12"/><rect x="1150" y="842" width="132" height="18" rx="9" fill="url(#amber)"/>
  </g>

  <g filter="url(#shadow)">
    <rect x="605" y="760" width="390" height="145" rx="48" fill="#24170f" opacity="0.94"/>
    <text x="800" y="825" text-anchor="middle" fill="#fff3dd" font-family="SF Pro Display, Helvetica, Arial, sans-serif" font-size="32" font-weight="600">Infrastructure</text>
    <text x="800" y="866" text-anchor="middle" fill="#d7c0a1" font-family="SF Pro Text, Helvetica, Arial, sans-serif" font-size="19">routing · state · fallback behavior</text>
  </g>
</svg>
