<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">Muhome IoT system diagram</title>
  <desc id="desc">A warm editorial systems diagram showing Lumen connected to HomeKit, Govee, Cync, motion sensing, scenes, and room logic.</desc>
  <defs>
    <linearGradient id="paper" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#fbf5ea"/>
      <stop offset="0.55" stop-color="#ead8bf"/>
      <stop offset="1" stop-color="#20160f"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.86"/>
      <stop offset="1" stop-color="#fff5e6" stop-opacity="0.48"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="22" stdDeviation="28" flood-color="#2b1c10" flood-opacity="0.16"/>
    </filter>
    <filter id="glow"><feGaussianBlur stdDeviation="24"/></filter>
  </defs>
  <rect width="1600" height="1000" fill="url(#paper)"/>
  <circle cx="260" cy="160" r="210" fill="#d18b3a" opacity="0.18" filter="url(#glow)"/>
  <circle cx="1320" cy="820" r="280" fill="#f3c06c" opacity="0.16" filter="url(#glow)"/>
  <path d="M110 210 C360 140 520 250 710 330 S1030 390 1250 260 1460 190 1510 260" fill="none" stroke="#6b543d" stroke-opacity="0.18" stroke-width="2"/>
  <path d="M120 760 C340 640 560 740 740 620 S1050 460 1240 590 1430 735 1500 640" fill="none" stroke="#6b543d" stroke-opacity="0.16" stroke-width="2"/>

  <g transform="translate(110 90)">
    <text x="0" y="0" fill="#21160f" font-family="SF Pro Display, Helvetica, Arial, sans-serif" font-size="54" font-weight="500">Muhome system layer</text>
    <text x="0" y="48" fill="#715b43" font-family="SF Pro Text, Helvetica, Arial, sans-serif" font-size="24">Device logic, room states, and scenes routed into Lumen.</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="585" y="315" width="430" height="300" rx="54" fill="#20160f"/>
    <text x="800" y="405" fill="#fff4e5" font-family="SF Pro Display, Helvetica, Arial, sans-serif" font-size="58" font-weight="500" text-anchor="middle">Lumen</text>
    <text x="800" y="455" fill="#d6c1a3" font-family="SF Pro Text, Helvetica, Arial, sans-serif" font-size="24" text-anchor="middle">production interface</text>
    <rect x="680" y="515" width="240" height="54" rx="27" fill="#d08a38"/>
    <text x="800" y="550" fill="#21160f" font-family="SF Pro Text, Helvetica, Arial, sans-serif" font-size="20" font-weight="600" text-anchor="middle">room control</text>
  </g>

  <g stroke="#7b6046" stroke-width="2.5" stroke-opacity="0.35" fill="none">
    <path d="M585 430H405"/><path d="M1015 430h180"/>
    <path d="M680 615L455 760"/><path d="M920 615l225 145"/>
    <path d="M800 315V190"/><path d="M800 615v170"/>
  </g>

  <g filter="url(#shadow)">
    <rect x="110" y="315" width="295" height="230" rx="42" fill="url(#panel)" stroke="#fff" stroke-opacity="0.54"/>
    <text x="150" y="390" fill="#21160f" font-family="SF Pro Display, Helvetica, Arial, sans-serif" font-size="36" font-weight="500">HomeKit</text>
    <text x="150" y="430" fill="#715b43" font-family="SF Pro Text, Helvetica, Arial, sans-serif" font-size="20">Scenes + rooms</text>
    <circle cx="320" cy="450" r="45" fill="#d08a38" opacity="0.24"/><circle cx="320" cy="450" r="24" fill="#d08a38"/>
  </g>
  <g filter="url(#shadow)">
    <rect x="1195" y="315" width="295" height="230" rx="42" fill="url(#panel)" stroke="#fff" stroke-opacity="0.54"/>
    <text x="1235" y="390" fill="#21160f" font-family="SF Pro Display, Helvetica, Arial, sans-serif" font-size="36" font-weight="500">Govee</text>
    <text x="1235" y="430" fill="#715b43" font-family="SF Pro Text, Helvetica, Arial, sans-serif" font-size="20">Wi-Fi color light</text>
    <rect x="1235" y="475" width="180" height="16" rx="8" fill="#21160f" opacity="0.1"/><rect x="1235" y="475" width="126" height="16" rx="8" fill="#d08a38"/>
  </g>
  <g filter="url(#shadow)">
    <rect x="610" y="90" width="380" height="185" rx="42" fill="url(#panel)" stroke="#fff" stroke-opacity="0.54"/>
    <text x="800" y="166" fill="#21160f" font-family="SF Pro Display, Helvetica, Arial, sans-serif" font-size="34" font-weight="500" text-anchor="middle">Room logic</text>
    <text x="800" y="207" fill="#715b43" font-family="SF Pro Text, Helvetica, Arial, sans-serif" font-size="20" text-anchor="middle">occupancy · time · scene state</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="610" y="755" width="380" height="165" rx="42" fill="url(#panel)" stroke="#fff" stroke-opacity="0.54"/>
    <text x="800" y="825" fill="#21160f" font-family="SF Pro Display, Helvetica, Arial, sans-serif" font-size="34" font-weight="500" text-anchor="middle">Automation queue</text>
    <text x="800" y="866" fill="#715b43" font-family="SF Pro Text, Helvetica, Arial, sans-serif" font-size="20" text-anchor="middle">dim · pause · restore · notify</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="185" y="675" width="310" height="200" rx="42" fill="url(#panel)" stroke="#fff" stroke-opacity="0.54"/>
    <text x="225" y="750" fill="#21160f" font-family="SF Pro Display, Helvetica, Arial, sans-serif" font-size="34" font-weight="500">Motion</text>
    <text x="225" y="790" fill="#715b43" font-family="SF Pro Text, Helvetica, Arial, sans-serif" font-size="20">sensor events</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="1105" y="675" width="310" height="200" rx="42" fill="url(#panel)" stroke="#fff" stroke-opacity="0.54"/>
    <text x="1145" y="750" fill="#21160f" font-family="SF Pro Display, Helvetica, Arial, sans-serif" font-size="34" font-weight="500">Cync</text>
    <text x="1145" y="790" fill="#715b43" font-family="SF Pro Text, Helvetica, Arial, sans-serif" font-size="20">local light state</text>
  </g>

  <g transform="translate(110 910)">
    <text x="0" y="0" fill="#f8efe1" opacity="0.76" font-family="SF Pro Text, Helvetica, Arial, sans-serif" font-size="20">Public site shows proof. Muhome stores the architecture. Lumen presents the interface.</text>
  </g>
</svg>
