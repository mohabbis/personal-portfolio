<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
  <title id="title">Interfaces visual study</title>
  <desc id="desc">An abstract Lumen-style interface composition with layered controls and glass panels.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#f8efe2"/><stop offset="1" stop-color="#19120d"/></linearGradient>
    <linearGradient id="glass" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#fffaf2" stop-opacity="0.9"/><stop offset="1" stop-color="#ffffff" stop-opacity="0.42"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="28" stdDeviation="30" flood-color="#2b1d10" flood-opacity="0.2"/></filter>
    <filter id="soft"><feGaussianBlur stdDeviation="28"/></filter>
  </defs>
  <rect width="1200" height="900" fill="url(#bg)"/>
  <circle cx="240" cy="190" r="230" fill="#d08a38" opacity="0.24" filter="url(#soft)"/>
  <circle cx="990" cy="710" r="260" fill="#f0bd68" opacity="0.16" filter="url(#soft)"/>
  <g filter="url(#shadow)">
    <rect x="125" y="112" width="440" height="675" rx="58" fill="#1f1712"/>
    <rect x="155" y="152" width="380" height="595" rx="42" fill="#f7efe3"/>
    <text x="195" y="224" fill="#2a1b12" font-family="SF Pro Display, Helvetica, Arial, sans-serif" font-size="36" font-weight="500">Lumen</text>
    <text x="195" y="265" fill="#765f48" font-family="SF Pro Text, Helvetica, Arial, sans-serif" font-size="20">Room control</text>
    <rect x="195" y="325" width="300" height="150" rx="30" fill="#fffaf2" stroke="#2a1b12" stroke-opacity="0.08"/>
    <text x="225" y="380" fill="#2a1b12" font-family="SF Pro Display, Helvetica, Arial, sans-serif" font-size="31">Studio</text>
    <text x="225" y="425" fill="#c88735" font-family="SF Pro Display, Helvetica, Arial, sans-serif" font-size="54">72%</text>
    <rect x="195" y="520" width="135" height="120" rx="28" fill="#2a1b12"/>
    <rect x="360" y="520" width="135" height="120" rx="28" fill="#fffaf2" stroke="#2a1b12" stroke-opacity="0.08"/>
    <circle cx="262" cy="580" r="26" fill="#d08a38"/>
    <circle cx="428" cy="580" r="26" fill="#2a1b12" opacity="0.12"/>
  </g>
  <g filter="url(#shadow)">
    <rect x="645" y="170" width="410" height="180" rx="44" fill="url(#glass)" stroke="#fff" stroke-opacity="0.55"/>
    <text x="690" y="240" fill="#2a1b12" font-family="SF Pro Display, Helvetica, Arial, sans-serif" font-size="33">Scene logic</text>
    <text x="690" y="286" fill="#765f48" font-family="SF Pro Text, Helvetica, Arial, sans-serif" font-size="20">motion clears → lights lower</text>
    <rect x="690" y="305" width="230" height="12" rx="6" fill="#2a1b12" opacity="0.1"/><rect x="690" y="305" width="160" height="12" rx="6" fill="#c88735"/>
    <rect x="620" y="410" width="500" height="230" rx="50" fill="url(#glass)" stroke="#fff" stroke-opacity="0.5"/>
    <text x="670" y="490" fill="#2a1b12" font-family="SF Pro Display, Helvetica, Arial, sans-serif" font-size="34">Device states</text>
    <g font-family="SF Pro Text, Helvetica, Arial, sans-serif" font-size="18" fill="#2a1b12">
      <rect x="670" y="535" width="105" height="45" rx="22" fill="#2a1b12" opacity="0.08"/><text x="722" y="564" text-anchor="middle">Govee</text>
      <rect x="795" y="535" width="105" height="45" rx="22" fill="#2a1b12" opacity="0.08"/><text x="847" y="564" text-anchor="middle">Cync</text>
      <rect x="920" y="535" width="120" height="45" rx="22" fill="#2a1b12" opacity="0.08"/><text x="980" y="564" text-anchor="middle">Motion</text>
    </g>
  </g>
  <text x="95" y="842" fill="#fff4e7" opacity="0.72" font-family="SF Pro Text, Helvetica, Arial, sans-serif" font-size="20">interface · room state · quiet control</text>
</svg>