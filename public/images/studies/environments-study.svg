    <path d="M590 360 L590 820" fill="none" stroke="#7b6046" stroke-opacity="0.22" stroke-width="3"/>
    <path d="M190 675 L590 510 L1010 690" fill="none" stroke="#7b6046" stroke-opacity="0.16" stroke-width="2"/>
    <circle cx="590" cy="360" r="74" fill="#d08a38" opacity="0.28"/>
    <circle cx="590" cy="360" r="32" fill="#d08a38"/>
    <circle cx="785" cy="292" r="52" fill="#f2c777" opacity="0.32"/>
    <circle cx="370" cy="285" r="46" fill="#2a1b12" opacity="0.12"/>
    <path d="M295 610 C430 500 535 555 675 455 S880 400 925 505" fill="none" stroke="#2a1b12" stroke-opacity="0.35" stroke-width="10" stroke-linecap="round" stroke-dasharray="1 28"/>
