<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
  <title id="title">Environments visual study</title>
  <desc id="desc">An abstract smart-room environment diagram with light zones, motion path, and hidden infrastructure.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#f6ecdd"/><stop offset="0.6" stop-color="#c8a982"/><stop offset="1" stop-color="#17100c"/></linearGradient>
    <linearGradient id="room" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#fff8ec"/><stop offset="1" stop-color="#e2c9aa"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="26" stdDeviation="32" flood-color="#2b1d10" flood-opacity="0.2"/></filter>
    <filter id="soft"><feGaussianBlur stdDeviation="30"/></filter>
  </defs>
  <rect width="1200" height="900" fill="url(#bg)"/>
  <circle cx="950" cy="145" r="250" fill="#f0bd68" opacity="0.2" filter="url(#soft)"/>
  <circle cx="250" cy="750" r="260" fill="#d08a38" opacity="0.18" filter="url(#soft)"/>
