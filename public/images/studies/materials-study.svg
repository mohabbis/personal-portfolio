<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
  <title id="title">Materials visual study</title>
  <desc id="desc">An abstract warm material composition with walnut, linen, paper, and amber light.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#f8f0e4"/>
      <stop offset="0.55" stop-color="#dbc2a4"/>
      <stop offset="1" stop-color="#2a1b12"/>
    </linearGradient>
    <linearGradient id="wood" x1="0" x2="1">
      <stop offset="0" stop-color="#2b180f"/>
      <stop offset="0.48" stop-color="#6f4529"/>
      <stop offset="1" stop-color="#b77a42"/>
    </linearGradient>
    <filter id="soft"><feGaussianBlur stdDeviation="24"/></filter>
  </defs>
  <rect width="1200" height="900" fill="url(#bg)"/>
