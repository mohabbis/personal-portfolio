<svg width="640" height="160" viewBox="0 0 640 160" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="wo-title">
  <title id="wo-title">WashOrbit</title>
  <defs>
    <linearGradient id="wo-ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#2563eb"/>
    </linearGradient>
    <radialGradient id="wo-core" cx="0.5" cy="0.4" r="0.7">
      <stop offset="0" stop-color="#60a5fa"/>
      <stop offset="1" stop-color="#2563eb"/>
    </radialGradient>
  </defs>

  <!-- Orbital mark -->
  <g transform="translate(80 80)">
    <!-- tilted orbit ring -->
    <ellipse cx="0" cy="0" rx="58" ry="26" fill="none" stroke="url(#wo-ring)" stroke-width="7" transform="rotate(-28)"/>
    <!-- core body (the wash) -->
    <circle cx="0" cy="0" r="21" fill="url(#wo-core)"/>
    <circle cx="0" cy="0" r="21" fill="none" stroke="#0b1220" stroke-opacity="0.12" stroke-width="1.5"/>
    <!-- satellite on the ring -->
    <circle cx="49" cy="-25" r="8" fill="#0b1220"/>
    <circle cx="49" cy="-25" r="8" fill="none" stroke="#3b82f6" stroke-width="2.5"/>
  </g>

  <!-- Wordmark -->
  <text x="150" y="98" font-family="'SF Pro Display','Segoe UI',Arial,sans-serif" font-size="62" font-weight="600" letter-spacing="-0.03em">
    <tspan fill="#0b1220">Wash</tspan><tspan fill="#2563eb">Orbit</tspan>
  </text>
</svg>
